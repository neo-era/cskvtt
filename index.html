<!DOCTYPE html>
<html lang="vi">
<head>
    <title>Lighting System V1.1</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <!-- Site metas -->
    <meta name="author" content="Mai Vũ Lâm">

    <!-- CSS -->
    <link rel="stylesheet" type="text/css" href="css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/jquery.mCustomScrollbar.min.css">
    <link rel="stylesheet" href="https://netdna.bootstrapcdn.com/font-awesome/4.0.3/css/font-awesome.css">
    <link rel="stylesheet" href="css/owl.carousel.min.css">
    <link rel="stylesheet" href="css/owl.theme.default.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/fancybox/2.1.5/jquery.fancybox.min.css" media="screen">

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

    <!-- Favicon -->
    <link rel="icon" href="images/fevicon.png" type="image/gif" />

    <!-- Bootstrap JS and jQuery -->
    <script src="js/jquery-3.0.0.min.js"></script>
    <script src="js/bootstrap.bundle.min.js"></script>

    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden; /* Prevent horizontal scroll on mobile */
        }

        h1 {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 18px;
            color: #2510c6;
            margin: 0;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.8);
            padding: 5px 10px;
            border-radius: 4px;
        }

        #controlsBtn {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
        }

        .controls-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .controls-container .form-group {
            margin-bottom: 15px;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .button-group .btn {
            margin: 0;
        }

        #pages, #searchInput {
            padding: 8px;
            margin: 5px;
            font-size: 16px;
        }

        button {
            background-color: #007bff;
            color: #fff;
            border: none;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 16px;
            margin: 5px;
        }

        button:hover {
            background-color: #0056b3;
        }

        #map {
            height: 100vh;
            width: 100%;
            touch-action: none; /* Improve touch handling on mobile */
            position: absolute;
            top: 0;
            left: 0;
        }

        .marker-popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.35);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            pointer-events: auto;
        }

        .marker-popup-card {
            width: min(420px, 100%);
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            border: 1px solid rgba(0,0,0,0.12);
        }

        .marker-popup-card header {
            padding: 16px 20px;
            background: #007bff;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
        }

        .marker-popup-card .body {
            padding: 16px 20px;
        }

        .marker-popup-card .body .form-group {
            margin-bottom: 14px;
        }

        .marker-popup-card .body label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .marker-popup-card .body input,
        .marker-popup-card .body textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ced4da;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.4;
        }

        .marker-popup-card .body textarea {
            resize: vertical;
            min-height: 90px;
        }

        .marker-popup-card .footer {
            padding: 14px 20px 18px;
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            background: #f8f9fa;
        }

        .marker-popup-card .footer button {
            min-width: 100px;
        }

        .marker-popup-card .coords-info {
            font-size: 13px;
            color: #555;
            margin-top: 6px;
        }

        .marker-image-preview {
            margin-top: 10px;
            display: flex;
            justify-content: center;
        }

        .marker-image-preview img {
            max-width: 100%;
            max-height: 140px;
            border-radius: 10px;
            border: 1px solid #dee2e6;
            object-fit: cover;
        }

        .marker-image-button {
            width: 100%;
            margin-top: 8px;
        }

        .leaflet-control-custom {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(0, 0, 0, 0.18);
            border-radius: 10px;
            box-shadow: 0 1px 8px rgba(0, 0, 0, 0.18);
            padding: 6px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .leaflet-control-custom button {
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 8px;
            background: #fff;
            color: #333;
            font-size: 16px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
        }

        .leaflet-control-custom button:hover {
            background: #f0f0f0;
            transform: translateY(-1px);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
        }

        .leaflet-control-custom button i {
            pointer-events: none;
        }

        #error {
            color: red;
            text-align: center;
            margin: 10px 0;
            font-weight: bold;
        }

        #searchResults {
            margin: 10px auto;
            font-size: 15px;
            max-width: 1200px;
            text-align: left;
            max-height: 150px;
            overflow-y: auto;
        }

        #searchResults ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        #searchResults li {
            margin: 4px 0;
            padding: 5px 8px;
            border-radius: 4px;
            transition: background-color 0.2s ease;
        }

        #searchResults li:hover {
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
        }

        #searchResults a {
            color: #007bff;
            text-decoration: none;
            display: block;
        }

        #searchResults a:hover {
            text-decoration: underline;
        }

        .custom-label {
            background: none;
            border: none;
            box-shadow: none;
            font-weight: bold;
            color: #000;
            text-shadow: 1px 1px 2px white;
        }

        .modal {
            z-index: 1050;
        }

        .modal-backdrop {
            z-index: 1040;
        }

        .modal.show {
            display: block;
        }

        /* Modal slide in from left */
        .modal.left .modal-dialog {
            position: fixed;
            left: -100%; /* Start off-screen */
            top: 0;
            height: 100vh;
            width: 400px; /* Fixed width for sidebar */
            margin: 0;
            transition: left 0.3s ease-in-out;
        }

        .modal.left.show .modal-dialog {
            left: 0; /* Slide in from left */
        }

        .modal.left .modal-content {
            height: 100vh;
            border-radius: 0;
            border: none;
        }

        .modal.left .modal-body {
            height: calc(100vh - 60px); /* Subtract header height */
            overflow-y: auto;
        }

        /* Responsive Design */
        @media only screen and (max-width: 768px) {
            h1 {
                font-size: 16px;
                top: 5px;
                left: 5px;
                padding: 3px 8px;
            }

            #controlsBtn {
                top: 5px;
                left: 50%;
                transform: translateX(-50%);
                padding: 8px 12px;
                font-size: 14px;
            }

            .controls-container {
                gap: 10px;
            }

            .button-group {
                grid-template-columns: 1fr;
            }

            #searchResults {
                max-height: 150px;
                font-size: 14px;
            }

            .modal-dialog {
                margin: 10px;
            }

            /* Mobile modal takes full screen */
            .modal.left .modal-dialog {
                width: 100vw !important;
                left: -100vw;
            }

            .modal.left.show .modal-dialog {
                left: 0;
            }
        }

        @media only screen and (max-width: 480px) {
            h1 {
                font-size: 14px;
                padding: 2px 6px;
            }

            #controlsBtn {
                padding: 6px 10px;
                font-size: 12px;
            }

            #searchResults {
                max-height: 120px;
                font-size: 12px;
            }

            /* Mobile modal takes full screen */
            .modal.left .modal-dialog {
                width: 100vw !important;
                left: -100vw;
            }

            .modal.left.show .modal-dialog {
                left: 0;
            }
        }
    </style>
</head>
<body>
    <h1>BẢN ĐỒ KHẢO SÁT HỆ THỐNG CHIẾU SÁNG CÔNG CỘNG</h1>

    <!-- Controls Button -->
    <button id="controlsBtn" class="btn btn-primary">
        <i class="fa fa-cog"></i> Điều khiển
    </button>

    <!-- Controls Modal -->
    <div class="modal fade left" id="controlsModal" tabindex="-1" role="dialog" aria-labelledby="controlsModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="controlsModalLabel">Điều khiển bản đồ</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div id="pageSelector" class="controls-container">
                        <div class="form-group">
                            <label for="pages">Chọn Quận:</label>
                            <select id="pages" class="form-control" onchange="navigateToPage()">
                                <option value="index.html">Trang khảo sát</option>
                                <option value="quan1.html">Quận 1</option>
                                <option value="index.html">Kế hoạch</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="searchInput">Tìm kiếm:</label>
                            <input type="text" id="searchInput" class="form-control" placeholder="Nhập tên trụ hoặc tọa độ (lat, lon)" />
                        </div>

                        <div class="button-group">
                            <button onclick="searchMarkers()" class="btn btn-success btn-block">Tìm kiếm</button>
                            <button onclick="centerOnUserLocation()" class="btn btn-info btn-block">Vị trí của tôi</button>
                            <button id="addMarkerBtn" onclick="startAddMarker()" class="btn btn-warning btn-block">Thêm marker</button>
                            <button onclick="saveMarkerData()" class="btn btn-secondary btn-block">Lưu dữ liệu</button>
                        </div>
                    </div>

                    <div id="error" class="alert alert-danger" style="display: none;"></div>
                    <div id="searchResults" class="mt-3"></div>

                </div>
            </div>
        </div>
    </div>
    <div id="map"></div>
    <div id="markerPopupForm" class="marker-popup-overlay" role="dialog" aria-modal="true">
        <div class="marker-popup-card">
            <header>Thông tin marker mới</header>
            <div class="body">
                <div class="form-group">
                    <label for="markerNameInput">Tên trụ</label>
                    <input id="markerNameInput" type="text" class="form-control" placeholder="Nhập tên trụ" />
                </div>
                <div class="form-group">
                    <label for="markerNoteInput">Ghi chú</label>
                    <textarea id="markerNoteInput" class="form-control" placeholder="Nhập ghi chú (tùy chọn)"></textarea>
                </div>
                <div class="form-group">
                    <button id="markerImageButton" type="button" class="btn btn-outline-primary marker-image-button" onclick="triggerMarkerImageInput()">Chụp / chọn ảnh</button>
                    <input id="markerImageInput" type="file" accept="image/*" capture="environment" style="display:none" onchange="handleMarkerImageFile(event)" />
                </div>
                <div class="marker-image-preview" id="markerImagePreview"></div>
                <div id="markerCoordsText" class="coords-info">Tọa độ: -</div>
            </div>
            <div class="footer">
                <button id="markerPopupCancel" type="button" class="btn btn-secondary" onclick="cancelMarkerPopup()">Hủy</button>
                <button id="markerPopupSave" type="button" class="btn btn-primary" onclick="saveMarkerPopup()">Lưu marker</button>
            </div>
        </div>
    </div>

      <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <script>
        let map;
        let markersCluster = L.markerClusterGroup();
        let labelLayerGroup = L.layerGroup();
        let markers = [];
        let loadedData = [];
        let currentLocation = null;
        let currentLocationMarker = null;
        let routeLine = null;
        let pendingNewMarker = false;
        let pendingMarkerLocation = null;
        let markerPopupLocation = null;
        let markerImageDataUrl = null;
        let addMarkerMode = false;
        const MAX_EXCEL_TEXT_LENGTH = 32767;

        function addMarkerRowToMap(row) {
            const name = row[1] || row[0] || '';
            const lat = parseFloat(row[2]);
            const lon = parseFloat(row[3]);
            const type = parseInt(row[6]);
            const note = row[4] || '';
            const tudieukhien = row[7];
            const loaitru = row[8];
            const loaican = row[9];
            const loaiden = row[10];
            const imageBase64 = row[11] || '';

            if (isNaN(lat) || isNaN(lon)) return null;

            const icon = customIcons[type] || customIcons.default;
            const markerIndex = markers.length;
            const marker = L.marker([lat, lon], { icon: icon });
            const imageHtml = imageBase64 ? `<div style="margin-top:8px;text-align:center;"><img src="${imageBase64}" alt="Ảnh trụ" style="max-width:100%;max-height:140px;border-radius:8px;border:1px solid #ccc;" /></div>` : '';
            const popupContent = `
                <div>
                    <strong>Tên trụ: ${name || 'Không có tên'}</strong><br>
                    Lat: ${lat.toFixed(6)}<br>
                    Lon: ${lon.toFixed(6)}<br>
                    Ghi chú: ${note || 'Không có'}<br>
                    Trụ: ${loaitru || ''}<br>
                    Tủ điều khiển: ${tudieukhien || ''}<br>
                    Đèn: ${loaiden || ''}<br>
                    ${imageHtml}
                    <button onclick="routeToMarker(${markerIndex})" style="margin-top:8px;padding:6px 10px;font-size:14px;cursor:pointer;">Dẫn đường xe máy</button>
                </div>`;

            marker.bindPopup(popupContent);
            markersCluster.addLayer(marker);
            markers.push({ lat, lon, name, note, marker });

            if (name) {
                const label = L.marker([lat, lon], {
                    icon: L.divIcon({
                        className: 'custom-label',
                        html: `<div style="font-size:12px; font-weight:bold;">${name}</div>`,
                        iconSize: [80, 20],
                        iconAnchor: [40, 30]
                    })
                }).addTo(map);
            }

            return marker;
        }

        function updateAddMarkerButton() {
            const btn = document.getElementById('addMarkerBtn');
            if (!btn) return;
            btn.textContent = addMarkerMode ? 'Dừng thêm marker' : 'Thêm marker';
            btn.classList.toggle('btn-danger', addMarkerMode);
            btn.classList.toggle('btn-warning', !addMarkerMode);
        }

        function enableAddMarkerMode() {
            addMarkerMode = true;
            pendingNewMarker = true;
            pendingMarkerLocation = null;
            updateAddMarkerButton();
            displayError('Chế độ thêm marker bật. Nhấn lại nút để kết thúc. Nhấp vào bản đồ để chọn vị trí trụ mới.');
        }

        function disableAddMarkerMode() {
            addMarkerMode = false;
            pendingNewMarker = false;
            pendingMarkerLocation = null;
            hideMarkerPopup();
            updateAddMarkerButton();
            displayError('Chế độ thêm marker đã tắt.');
        }

        // Custom Icons
        const customIcons = {
            1: L.icon({ iconUrl: 'images/1.png', iconSize: [10, 10], iconAnchor: [5, 5], popupAnchor: [0, -10] }),
            2: L.icon({ iconUrl: 'images/2.png', iconSize: [10, 10], iconAnchor: [5, 5], popupAnchor: [0, -10] }),
            3: L.icon({ iconUrl: 'images/3.png', iconSize: [10, 10], iconAnchor: [5, 5], popupAnchor: [0, -10] }),
            4: L.icon({ iconUrl: 'images/4.png', iconSize: [10, 10], iconAnchor: [5, 5], popupAnchor: [0, -10] }),
            5: L.icon({ iconUrl: 'images/5.png', iconSize: [10, 10], iconAnchor: [5, 5], popupAnchor: [0, -10] }),
            6: L.icon({ iconUrl: 'images/9.png', iconSize: [16, 20], iconAnchor: [8, 10], popupAnchor: [0, -10] }),
            7: L.icon({ iconUrl: 'images/7.png', iconSize: [10, 10], iconAnchor: [5, 5], popupAnchor: [0, -10] }),
            default: L.icon({ iconUrl: 'images/8.png', iconSize: [10, 10], iconAnchor: [5, 5], popupAnchor: [0, -10] })
        };

        function initializeMap() {
            const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 33,
                attribution: '© OpenStreetMap contributors'
            });

            const satellite = L.tileLayer('https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
                maxZoom: 33,
                subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
                attribution: '© Google Maps'
            });

            map = L.map('map', {
                center: [10.762622, 106.660172],
                zoom: 13,
                maxZoom: 33,
                layers: [osm]
            });

            L.control.layers({
                "OpenStreetMap": osm,
                "Satellite": satellite
            }).addTo(map);

            // Add zoom display control
            L.control.zoomDisplay = function(opts) {
                return new L.Control.ZoomDisplay(opts);
            };

            L.Control.ZoomDisplay = L.Control.extend({
                options: {
                    position: 'topright'
                },

                onAdd: function(map) {
                    this._container = L.DomUtil.create('div', 'leaflet-control-zoom-display');
                    this._container.style.backgroundColor = 'white';
                    this._container.style.padding = '5px 10px';
                    this._container.style.border = '2px solid rgba(0,0,0,0.2)';
                    this._container.style.borderRadius = '4px';
                    this._container.style.fontSize = '14px';
                    this._container.style.fontWeight = 'bold';
                    this._container.style.color = '#333';
                    this._container.style.boxShadow = '0 1px 5px rgba(0,0,0,0.4)';

                    this._updateZoom();
                    map.on('zoomend', this._updateZoom, this);

                    return this._container;
                },

                onRemove: function(map) {
                    map.off('zoomend', this._updateZoom, this);
                },

                _updateZoom: function() {
                    if (this._container) {
                        this._container.innerHTML = 'Zoom: ' + this._map.getZoom();
                    }
                }
            });

            L.control.zoomDisplay().addTo(map);
            createMapControls();

            map.addLayer(markersCluster);
            map.addLayer(labelLayerGroup);

            map.on('click', function(e) {
                if (!pendingNewMarker) return;
                showMarkerPopupAt(e.latlng.lat, e.latlng.lng);
            });

            return map;
        }

        function addMarkersToMap(data) {
            markersCluster.clearLayers();
            labelLayerGroup.clearLayers();
            markers = [];

            data.forEach(row => {
                addMarkerRowToMap(row);
            });

            if (markers.length > 0) {
                map.fitBounds(markersCluster.getBounds().pad(0.1));
            }
        }

        function processFile(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                    const jsonData = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });
                    loadedData = jsonData;
                    addMarkersToMap(jsonData);
                } catch (error) {
                    displayError('Lỗi xử lý file Excel: ' + error.message);
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function startAddMarker() {
            if (addMarkerMode) {
                disableAddMarkerMode();
                return;
            }

            const useCurrentLocation = confirm('Sử dụng vị trí hiện tại?\n\nNhấn OK để dùng vị trí hiện tại, nhấn Cancel để chọn trên bản đồ.');
            enableAddMarkerMode();
            if (useCurrentLocation) {
                if (!navigator.geolocation) {
                    displayError('Trình duyệt không hỗ trợ định vị.');
                    disableAddMarkerMode();
                    return;
                }

                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        showMarkerPopupAt(lat, lon);
                    },
                    function(error) {
                        displayError('Không thể lấy vị trí: ' + error.message);
                        disableAddMarkerMode();
                    }
                );
            }
        }

        function showMarkerPopupAt(lat, lon) {
            markerPopupLocation = [lat, lon];
            pendingMarkerLocation = [lat, lon];
            pendingNewMarker = true;
            addMarkerMode = true;
            updateAddMarkerButton();
            displayError('Nhập thông tin marker mới và nhấn Lưu marker.');

            const overlay = document.getElementById('markerPopupForm');
            const nameInput = document.getElementById('markerNameInput');
            const noteInput = document.getElementById('markerNoteInput');
            const coordsText = document.getElementById('markerCoordsText');
            const preview = document.getElementById('markerImagePreview');
            const fileInput = document.getElementById('markerImageInput');

            if (!overlay || !nameInput || !noteInput || !coordsText || !preview || !fileInput) {
                displayError('Không thể hiển thị form marker.');
                return;
            }

            nameInput.value = '';
            noteInput.value = '';
            preview.innerHTML = '';
            fileInput.value = null;
            coordsText.textContent = `Tọa độ: ${lat.toFixed(6)}, ${lon.toFixed(6)}`;
            overlay.style.display = 'flex';
            nameInput.focus();
        }

        function hideMarkerPopup() {
            const overlay = document.getElementById('markerPopupForm');
            if (overlay) overlay.style.display = 'none';
            markerPopupLocation = null;
            markerImageDataUrl = null;
            const fileInput = document.getElementById('markerImageInput');
            if (fileInput) fileInput.value = null;
        }

        function triggerMarkerImageInput() {
            const fileInput = document.getElementById('markerImageInput');
            if (fileInput) {
                fileInput.value = null;
                fileInput.click();
            }
        }

        function resizeImageDataUrl(dataUrl, callback) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                let width = img.width;
                let height = img.height;
                const maxSide = 400;
                const scale = Math.min(1, maxSide / Math.max(width, height));
                width = Math.round(width * scale);
                height = Math.round(height * scale);
                let quality = 0.92;

                const ctx = canvas.getContext('2d');

                function render() {
                    canvas.width = width;
                    canvas.height = height;
                    ctx.clearRect(0, 0, width, height);
                    ctx.drawImage(img, 0, 0, width, height);
                    const result = canvas.toDataURL('image/jpeg', quality);
                    return result;
                }

                let result = render();
                while (result.length > MAX_EXCEL_TEXT_LENGTH && quality > 0.1) {
                    quality -= 0.1;
                    result = render();
                }

                while (result.length > MAX_EXCEL_TEXT_LENGTH && Math.max(width, height) > 120) {
                    width = Math.round(width * 0.85);
                    height = Math.round(height * 0.85);
                    result = render();
                }

                if (result.length > MAX_EXCEL_TEXT_LENGTH) {
                    callback('', 'Ảnh quá lớn để lưu vào ô Excel. Vui lòng chọn ảnh nhỏ hơn hoặc chụp lại.');
                    return;
                }

                callback(result);
            };
            img.onerror = function() {
                callback('', 'Không thể đọc ảnh.');
            };
            img.src = dataUrl;
        }

        function handleMarkerImageFile(event) {
            const file = event.target.files && event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                resizeImageDataUrl(e.target.result, function(resizedDataUrl, errorMessage) {
                    const preview = document.getElementById('markerImagePreview');
                    if (resizedDataUrl) {
                        markerImageDataUrl = resizedDataUrl;
                        if (preview) {
                            preview.innerHTML = `<img src="${markerImageDataUrl}" alt="Ảnh trụ" />`;
                        }
                        displayError('Ảnh đã sẵn sàng lưu vào Excel.');
                    } else {
                        markerImageDataUrl = '';
                        if (preview) {
                            preview.innerHTML = '';
                        }
                        displayError(errorMessage);
                    }
                });
            };
            reader.readAsDataURL(file);
        }

        function saveMarkerPopup() {
            try {
                const nameInput = document.getElementById('markerNameInput');
                const noteInput = document.getElementById('markerNoteInput');

                if (!markerPopupLocation || !Array.isArray(markerPopupLocation) || markerPopupLocation.length !== 2) {
                    displayError('Không có vị trí marker để lưu.');
                    hideMarkerPopup();
                    return;
                }

                const lat = Number(markerPopupLocation[0]);
                const lon = Number(markerPopupLocation[1]);
                if (!Number.isFinite(lat) || !Number.isFinite(lon)) {
                    displayError('Tọa độ marker không hợp lệ.');
                    hideMarkerPopup();
                    return;
                }

                const name = nameInput.value.trim();
                const note = noteInput.value.trim();

                if (!name) {
                    displayError('Vui lòng nhập tên trụ.');
                    nameInput.focus();
                    return;
                }

                const type = 7;
                const imageData = markerImageDataUrl || '';
                if (!Array.isArray(loadedData)) {
                    loadedData = [];
                }
                const newRow = ['', name, lat, lon, note, '', type, '', '', '', '', imageData];
                loadedData.push(newRow);
                const newMarker = addMarkerRowToMap(newRow);

                if (newMarker) {
                    map.setView([newMarker.getLatLng().lat, newMarker.getLatLng().lng], 19);
                    newMarker.openPopup();
                }

                hideMarkerPopup();
                pendingNewMarker = true;
                addMarkerMode = true;
                pendingMarkerLocation = null;
                updateAddMarkerButton();
                displayError('Đã thêm marker mới. Vẫn ở chế độ thêm marker, chọn điểm khác trên bản đồ.');
            } catch (error) {
                console.error('saveMarkerPopup error:', error);
                displayError('Lỗi khi lưu marker: ' + (error.message || error));
            }
        }

        function cancelMarkerPopup() {
            hideMarkerPopup();
            displayError(addMarkerMode ? 'Đã hủy nhập marker. Vui lòng chọn lại vị trí hoặc nhấn Thêm marker để tắt.' : 'Đã hủy nhập marker.');
            pendingNewMarker = addMarkerMode;
            if (!addMarkerMode) {
                pendingMarkerLocation = null;
            }
        }

        function saveMarkerData() {
            try {
                if (!loadedData || loadedData.length === 0) {
                    displayError('Không có dữ liệu để lưu.');
                    return;
                }

                const worksheet = XLSX.utils.aoa_to_sheet(loadedData);
                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, 'Sheet1');
                if (typeof XLSX.writeFile === 'function') {
                    XLSX.writeFile(workbook, 'khaosat-updated.xlsx');
                } else {
                    const wbout = XLSX.write(workbook, { bookType: 'xlsx', type: 'array' });
                    const blob = new Blob([wbout], { type: 'application/octet-stream' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = url;
                    a.download = 'khaosat-updated.xlsx';
                    document.body.appendChild(a);
                    a.click();
                    setTimeout(() => {
                        document.body.removeChild(a);
                        URL.revokeObjectURL(url);
                    }, 100);
                }

                displayError('File dữ liệu đã được tạo và tải xuống.');
            } catch (error) {
                console.error('saveMarkerData error:', error);
                displayError('Lỗi khi tải file dữ liệu: ' + (error.message || error));
            }
        }

        function loadDefaultFile() {
            fetch('data/khaosat.xlsx')
                .then(response => {
                    if (!response.ok) throw new Error('File không tồn tại');
                    return response.blob();
                })
                .then(blob => {
                    const file = new File([blob], 'khaosat.xlsx');
                    processFile(file);
                })
                .catch(error => {
                    displayError('Không thể tải file dữ liệu mặc định: ' + error.message);
                    console.error(error);
                });
        }

        function navigateToPage() {
            const select = document.getElementById("pages");
            if (select.value) {
                window.location.href = select.value;
            }
        }

        function normalizeText(text) {
            return (text || '').toString().normalize('NFD').replace(/\p{Diacritic}/gu, '').toLowerCase();
        }

        function clearSearchResults() {
            const results = document.getElementById('searchResults');
            if (results) {
                results.innerHTML = '';
            }
        }

        function closeControlsModal() {
            const modal = document.getElementById('controlsModal');
            if (!modal) return;

            if (typeof $ !== 'undefined' && $.fn.modal) {
                $('#controlsModal').modal('hide');
            } else {
                modal.classList.remove('show');
                modal.style.display = 'none';
                document.body.classList.remove('modal-open');
                const backdrop = document.querySelector('.modal-backdrop');
                if (backdrop) {
                    backdrop.remove();
                }
            }
        }

        function goToMarker(index) {
            const item = markers[index];
            if (!item) return;
            map.setView([item.lat, item.lon], 18);
            item.marker.openPopup();
            closeControlsModal();
        }

        function searchMarkers() {
            const rawInput = document.getElementById('searchInput').value.trim();
            clearSearchResults();
            console.log('Searching for:', rawInput);
            console.log('Total markers:', markers.length);
            console.log('First few markers:', markers.slice(0, 3));
            if (!rawInput) {
                displayError('Vui lòng nhập tên trụ hoặc tọa độ để tìm kiếm.');
                return;
            }

            const input = normalizeText(rawInput);
            const matches = [];

            for (let i = 0; i < markers.length; i++) {
                const item = markers[i];
                const itemName = normalizeText(item.name || item.label || '');
                const itemNote = normalizeText(item.note || '');
                if (itemName.includes(input) || itemNote.includes(input)) {
                    matches.push({ index: i, item });
                }
            }

            if (matches.length === 1) {
                const match = matches[0];
                map.setView([match.item.lat, match.item.lon], 18);
                match.item.marker.openPopup();
                displayError(`Tìm thấy 1 kết quả: ${match.item.name || 'Không có tên'}`);
                return;
            }

            if (matches.length > 1) {
                const firstMatch = matches[0];
                map.setView([firstMatch.item.lat, firstMatch.item.lon], 18);
                firstMatch.item.marker.openPopup();

                const results = document.getElementById('searchResults');
                const list = document.createElement('ul');
                // Hiển thị toàn bộ kết quả
                matches.forEach(match => {
                    const listItem = document.createElement('li');
                    const link = document.createElement('a');
                    link.href = '#';
                    link.textContent = `${match.item.name || 'Không có tên'} (${match.item.lat.toFixed(6)}, ${match.item.lon.toFixed(6)})`;
                    link.onclick = function(event) {
                        event.preventDefault();
                        goToMarker(match.index);
                    };
                    // Thêm event listeners cho hover effect
                    link.onmouseover = function() {
                        if (match.item.marker._icon) {
                            match.item.marker._icon.classList.add('marker-highlight');
                        }
                    };
                    link.onmouseout = function() {
                        if (match.item.marker._icon) {
                            match.item.marker._icon.classList.remove('marker-highlight');
                        }
                    };
                    listItem.appendChild(link);
                    list.appendChild(listItem);
                });
                results.appendChild(list);
                displayError(`Tìm thấy ${matches.length} kết quả. Nhấp vào danh sách để tới marker tương ứng.`);
                return;
            }

            if (rawInput.includes(',')) {
                const coords = rawInput.split(',').map(c => parseFloat(c.trim()));
                if (coords.length === 2 && !isNaN(coords[0]) && !isNaN(coords[1])) {
                    map.setView([coords[0], coords[1]], 18);
                    displayError(`Đã nhảy tới tọa độ: ${coords[0].toFixed(6)}, ${coords[1].toFixed(6)}`);
                    return;
                }
            }

            displayError('Không tìm thấy điểm nào phù hợp.');
        }

        function displayError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.style.display = message ? 'block' : 'none';
        }

        function updateCurrentLocationMarker(lat, lon) {
            currentLocation = [lat, lon];

            if (currentLocationMarker) {
                currentLocationMarker.setLatLng(currentLocation);
            } else {
                currentLocationMarker = L.marker(currentLocation, { icon: customIcons.default })
                    .addTo(map)
                    .bindPopup('Vị trí hiện tại của bạn');
            }
        }

        function createMapControls() {
            const CustomControl = L.Control.extend({
                options: {
                    position: 'topright'
                },

                onAdd: function(map) {
                    const container = L.DomUtil.create('div', 'leaflet-control-custom');
                    L.DomEvent.disableClickPropagation(container);
                    L.DomEvent.disableScrollPropagation(container);

                    const locateBtn = L.DomUtil.create('button', '', container);
                    locateBtn.type = 'button';
                    locateBtn.title = 'Về vị trí hiện tại';
                    locateBtn.innerHTML = '<i class="fa fa-location-arrow"></i>';
                    L.DomEvent.on(locateBtn, 'click', L.DomEvent.stopPropagation)
                        .on(locateBtn, 'click', L.DomEvent.preventDefault)
                        .on(locateBtn, 'click', () => centerOnUserLocation());

                    const routeBtn = L.DomUtil.create('button', '', container);
                    routeBtn.type = 'button';
                    routeBtn.title = 'Dẫn đường tới trung tâm bản đồ';
                    routeBtn.innerHTML = '<i class="fa fa-compass"></i>';
                    L.DomEvent.on(routeBtn, 'click', L.DomEvent.stopPropagation)
                        .on(routeBtn, 'click', L.DomEvent.preventDefault)
                        .on(routeBtn, 'click', () => routeToMapCenter());

                    const clearBtn = L.DomUtil.create('button', '', container);
                    clearBtn.type = 'button';
                    clearBtn.title = 'Xóa lộ trình';
                    clearBtn.innerHTML = '<i class="fa fa-times"></i>';
                    L.DomEvent.on(clearBtn, 'click', L.DomEvent.stopPropagation)
                        .on(clearBtn, 'click', L.DomEvent.preventDefault)
                        .on(clearBtn, 'click', () => clearRoute());

                    return container;
                }
            });

            map.addControl(new CustomControl());
        }

        function routeToMapCenter() {
            const destination = [map.getCenter().lat, map.getCenter().lng];

            if (!Number.isFinite(destination[0]) || !Number.isFinite(destination[1])) {
                displayError('Không thể lấy điểm đến từ trung tâm bản đồ.');
                return;
            }

            function doRoute() {
                fetchMotorbikeRoute(currentLocation, destination)
                    .then(route => {
                        drawRoute(route);
                    })
                    .catch(error => {
                        displayError(error.message);
                    });
            }

            if (currentLocation) {
                doRoute();
                return;
            }

            if (!navigator.geolocation) {
                displayError('Trình duyệt không hỗ trợ định vị.');
                return;
            }

            navigator.geolocation.getCurrentPosition(
                function(position) {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    updateCurrentLocationMarker(lat, lon);
                    doRoute();
                },
                function(error) {
                    displayError('Không thể lấy vị trí: ' + error.message);
                }
            );
        }

        function clearRoute() {
            if (routeLine) {
                map.removeLayer(routeLine);
                routeLine = null;
            }
        }

        function fetchMotorbikeRoute(origin, destination) {
            const url = `https://router.project-osrm.org/route/v1/driving/${origin[1]},${origin[0]};${destination[1]},${destination[0]}?overview=full&geometries=geojson`;
            return fetch(url)
                .then(response => {
                    if (!response.ok) throw new Error('Không thể tải lộ trình.');
                    return response.json();
                })
                .then(data => {
                    if (!data.routes || data.routes.length === 0 || data.code !== 'Ok') {
                        throw new Error('Không tìm thấy lộ trình xe máy.');
                    }
                    return data.routes[0];
                });
        }

        function drawRoute(route) {
            clearRoute();

            routeLine = L.geoJSON(route.geometry, {
                style: {
                    color: 'red',
                    weight: 5,
                    opacity: 0.8
                }
            }).addTo(map);

            if (routeLine && routeLine.getBounds) {
                map.fitBounds(routeLine.getBounds().pad(0.15));
            }

            if (route.distance != null && route.duration != null) {
                const distanceKm = (route.distance / 1000).toFixed(1);
                const durationMin = Math.round(route.duration / 60);
                displayError(`Lộ trình xe máy: ${distanceKm} km, khoảng ${durationMin} phút.`);
            }
        }

        function routeToMarker(index) {
            const target = markers[index];
            if (!target) {
                displayError('Marker không tồn tại.');
                return;
            }

            function routeFromCurrentLocation() {
                fetchMotorbikeRoute(currentLocation, [target.lat, target.lon])
                    .then(route => {
                        drawRoute(route);
                        target.marker.openPopup();
                    })
                    .catch(error => {
                        displayError(error.message);
                    });
            }

            if (currentLocation) {
                routeFromCurrentLocation();
                return;
            }

            if (!navigator.geolocation) {
                displayError('Trình duyệt không hỗ trợ định vị.');
                return;
            }

            navigator.geolocation.getCurrentPosition(
                function(position) {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    updateCurrentLocationMarker(lat, lon);
                    routeFromCurrentLocation();
                },
                function(error) {
                    displayError('Không thể lấy vị trí: ' + error.message);
                }
            );
        }

        function centerOnUserLocation() {
            if (!navigator.geolocation) {
                displayError('Trình duyệt không hỗ trợ định vị.');
                return;
            }

            navigator.geolocation.getCurrentPosition(
                function(position) {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    updateCurrentLocationMarker(lat, lon);
                    map.setView([lat, lon], 19);
                },
                function(error) {
                    displayError('Không thể lấy vị trí: ' + error.message);
                }
            );
        }

        // Initialize when page loads
        window.onload = function() {
            map = initializeMap();
            loadDefaultFile();

            // Setup modal controls
            console.log('Setting up modal controls...');
            const controlsBtn = document.getElementById('controlsBtn');
            console.log('Controls button:', controlsBtn);
            if (controlsBtn) {
                controlsBtn.addEventListener('click', function() {
                    console.log('Controls button clicked');
                    // Try jQuery first, fallback to vanilla JS
                    if (typeof $ !== 'undefined' && $.fn.modal) {
                        $('#controlsModal').modal({
                            backdrop: true,
                            keyboard: true,
                            show: true
                        });
                    } else {
                        console.log('jQuery not available, using vanilla JS');
                        const modal = document.getElementById('controlsModal');
                        if (modal) {
                            modal.style.display = 'block';
                            // Force reflow before adding show class for transition
                            modal.offsetHeight;
                            modal.classList.add('show');
                            document.body.classList.add('modal-open');

                            // Add backdrop
                            const backdrop = document.createElement('div');
                            backdrop.className = 'modal-backdrop show';
                            document.body.appendChild(backdrop);

                            // Close modal when clicking backdrop or close button
                            backdrop.onclick = function() {
                                modal.classList.remove('show');
                                setTimeout(() => {
                                    modal.style.display = 'none';
                                    document.body.classList.remove('modal-open');
                                    document.body.removeChild(backdrop);
                                }, 300); // Wait for transition
                            };

                            const closeBtn = modal.querySelector('.close');
                            if (closeBtn) {
                                closeBtn.onclick = function() {
                                    modal.classList.remove('show');
                                    setTimeout(() => {
                                        modal.style.display = 'none';
                                        document.body.classList.remove('modal-open');
                                        document.body.removeChild(backdrop);
                                    }, 300); // Wait for transition
                                };
                            }
                        }
                    }
                });
                console.log('Event listener attached');
            } else {
                console.error('Controls button not found');
            }

            const saveMarkerBtn = document.getElementById('markerPopupSave');
            const cancelMarkerBtn = document.getElementById('markerPopupCancel');
            if (saveMarkerBtn) {
                saveMarkerBtn.addEventListener('click', saveMarkerPopup);
            }
            if (cancelMarkerBtn) {
                cancelMarkerBtn.addEventListener('click', cancelMarkerPopup);
            }
        };
    </script>
</body>
</html>
