<!DOCTYPE html>
<html lang="vi">
<head>
    <title>Lighting System V1.1</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <!-- Site metas -->
    <meta name="author" content="Mai Vũ Lâm">

    <!-- CSS -->
    <link rel="stylesheet" type="text/css" href="css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/jquery.mCustomScrollbar.min.css">
    <link rel="stylesheet" href="https://netdna.bootstrapcdn.com/font-awesome/4.0.3/css/font-awesome.css">
    <link rel="stylesheet" href="css/owl.carousel.min.css">
    <link rel="stylesheet" href="css/owl.theme.default.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/fancybox/2.1.5/jquery.fancybox.min.css" media="screen">

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

    <!-- Favicon -->
    <link rel="icon" href="images/fevicon.png" type="image/gif" />

    <!-- Bootstrap JS and jQuery -->
    <script src="js/jquery-3.0.0.min.js"></script>
    <script src="js/bootstrap.bundle.min.js"></script>

    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden; /* Prevent horizontal scroll on mobile */
        }

        h1 {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 18px;
            color: #2510c6;
            margin: 0;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.8);
            padding: 5px 10px;
            border-radius: 4px;
        }

        #controlsBtn {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
        }

        .controls-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .controls-container .form-group {
            margin-bottom: 15px;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .button-group .btn {
            margin: 0;
        }

        #pages, #searchInput {
            padding: 8px;
            margin: 5px;
            font-size: 16px;
        }

        button {
            background-color: #007bff;
            color: #fff;
            border: none;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 16px;
            margin: 5px;
        }

        button:hover {
            background-color: #0056b3;
        }

        #map {
            height: 100vh;
            width: 100%;
            touch-action: none; /* Improve touch handling on mobile */
            position: absolute;
            top: 0;
            left: 0;
        }

        #error {
            color: red;
            text-align: center;
            margin: 10px 0;
            font-weight: bold;
        }

        #searchResults {
            margin: 10px auto;
            font-size: 15px;
            max-width: 1200px;
            text-align: left;
            max-height: 150px;
            overflow-y: auto;
        }

        #searchResults ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        #searchResults li {
            margin: 4px 0;
            padding: 5px 8px;
            border-radius: 4px;
            transition: background-color 0.2s ease;
        }

        #searchResults li:hover {
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
        }

        #searchResults a {
            color: #007bff;
            text-decoration: none;
            display: block;
        }

        #searchResults a:hover {
            text-decoration: underline;
        }

        .custom-label {
            background: none;
            border: none;
            box-shadow: none;
            font-weight: bold;
            color: #000;
            text-shadow: 1px 1px 2px white;
        }

        .modal {
            z-index: 1050;
        }

        .modal-backdrop {
            z-index: 1040;
        }

        .modal.show {
            display: block;
        }

        /* Modal slide in from left */
        .modal.left .modal-dialog {
            position: fixed;
            left: -100%; /* Start off-screen */
            top: 0;
            height: 100vh;
            width: 400px; /* Fixed width for sidebar */
            margin: 0;
            transition: left 0.3s ease-in-out;
        }

        .modal.left.show .modal-dialog {
            left: 0; /* Slide in from left */
        }

        .modal.left .modal-content {
            height: 100vh;
            border-radius: 0;
            border: none;
        }

        .modal.left .modal-body {
            height: calc(100vh - 60px); /* Subtract header height */
            overflow-y: auto;
        }

        /* Responsive Design */
        @media only screen and (max-width: 768px) {
            h1 {
                font-size: 16px;
                top: 5px;
                left: 5px;
                padding: 3px 8px;
            }

            #controlsBtn {
                top: 5px;
                left: 50%;
                transform: translateX(-50%);
                padding: 8px 12px;
                font-size: 14px;
            }

            .controls-container {
                gap: 10px;
            }

            .button-group {
                grid-template-columns: 1fr;
            }

            #searchResults {
                max-height: 150px;
                font-size: 14px;
            }

            .modal-dialog {
                margin: 10px;
            }

            /* Mobile modal takes full screen */
            .modal.left .modal-dialog {
                width: 100vw !important;
                left: -100vw;
            }

            .modal.left.show .modal-dialog {
                left: 0;
            }
        }

        @media only screen and (max-width: 480px) {
            h1 {
                font-size: 14px;
                padding: 2px 6px;
            }

            #controlsBtn {
                padding: 6px 10px;
                font-size: 12px;
            }

            #searchResults {
                max-height: 120px;
                font-size: 12px;
            }

            /* Mobile modal takes full screen */
            .modal.left .modal-dialog {
                width: 100vw !important;
                left: -100vw;
            }

            .modal.left.show .modal-dialog {
                left: 0;
            }
        }
    </style>
</head>
<body>
    <h1>BẢN ĐỒ KHẢO SÁT HỆ THỐNG CHIẾU SÁNG CÔNG CỘNG</h1>

    <!-- Controls Button -->
    <button id="controlsBtn" class="btn btn-primary">
        <i class="fa fa-cog"></i> Điều khiển
    </button>

    <!-- Controls Modal -->
    <div class="modal fade left" id="controlsModal" tabindex="-1" role="dialog" aria-labelledby="controlsModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="controlsModalLabel">Điều khiển bản đồ</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div id="pageSelector" class="controls-container">
                        <div class="form-group">
                            <label for="pages">Chọn Quận:</label>
                            <select id="pages" class="form-control" onchange="navigateToPage()">
                                <option value="index.html">Trang khảo sát</option>
                                <option value="index.html">Quận 1</option>
                                <option value="index.html">Kế hoạch</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="searchInput">Tìm kiếm:</label>
                            <input type="text" id="searchInput" class="form-control" placeholder="Nhập tên trụ hoặc tọa độ (lat, lon)" />
                        </div>

                        <div class="button-group">
                            <button onclick="searchMarkers()" class="btn btn-success btn-block">Tìm kiếm</button>
                            <button onclick="centerOnUserLocation()" class="btn btn-info btn-block">Vị trí của tôi</button>
                            <button id="addMarkerBtn" onclick="startAddMarker()" class="btn btn-warning btn-block">Thêm marker</button>
                            <button onclick="saveMarkerData()" class="btn btn-secondary btn-block">Lưu dữ liệu</button>
                        </div>
                    </div>

                    <div id="error" class="alert alert-danger" style="display: none;"></div>
                    <div id="searchResults" class="mt-3"></div>
                </div>
            </div>
        </div>
    </div>
    <div id="map"></div>

      <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <script>
        let map;
        let markersCluster = L.markerClusterGroup();
        let labelLayerGroup = L.layerGroup();
        let markers = [];
        let loadedData = [];
        let currentLocation = null;
        let currentLocationMarker = null;
        let routeLine = null;
        let pendingNewMarker = false;
        let pendingMarkerLocation = null;
        let addMarkerMode = false;

        function updateAddMarkerButton() {
            const btn = document.getElementById('addMarkerBtn');
            if (!btn) return;
            btn.textContent = addMarkerMode ? 'Dừng thêm marker' : 'Thêm marker';
            btn.classList.toggle('btn-danger', addMarkerMode);
            btn.classList.toggle('btn-warning', !addMarkerMode);
        }

        function enableAddMarkerMode() {
            addMarkerMode = true;
            pendingNewMarker = true;
            pendingMarkerLocation = null;
            updateAddMarkerButton();
            displayError('Chế độ thêm marker bật. Nhấn lại nút để kết thúc. Nhấp vào bản đồ để chọn vị trí trụ mới.');
        }

        function disableAddMarkerMode() {
            addMarkerMode = false;
            pendingNewMarker = false;
            pendingMarkerLocation = null;
            updateAddMarkerButton();
            displayError('Chế độ thêm marker đã tắt.');
        }

        // Custom Icons
        const customIcons = {
            1: L.icon({ iconUrl: 'images/1.png', iconSize: [10, 10], iconAnchor: [5, 5], popupAnchor: [0, -10] }),
            2: L.icon({ iconUrl: 'images/2.png', iconSize: [10, 10], iconAnchor: [5, 5], popupAnchor: [0, -10] }),
            3: L.icon({ iconUrl: 'images/3.png', iconSize: [10, 10], iconAnchor: [5, 5], popupAnchor: [0, -10] }),
            4: L.icon({ iconUrl: 'images/4.png', iconSize: [10, 10], iconAnchor: [5, 5], popupAnchor: [0, -10] }),
            5: L.icon({ iconUrl: 'images/5.png', iconSize: [10, 10], iconAnchor: [5, 5], popupAnchor: [0, -10] }),
            6: L.icon({ iconUrl: 'images/9.png', iconSize: [16, 20], iconAnchor: [8, 10], popupAnchor: [0, -10] }),
            7: L.icon({ iconUrl: 'images/7.png', iconSize: [10, 10], iconAnchor: [5, 5], popupAnchor: [0, -10] }),
            default: L.icon({ iconUrl: 'images/8.png', iconSize: [10, 10], iconAnchor: [5, 5], popupAnchor: [0, -10] })
        };

        function initializeMap() {
            const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 33,
                attribution: '© OpenStreetMap contributors'
            });

            const satellite = L.tileLayer('https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
                maxZoom: 33,
                subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
                attribution: '© Google Maps'
            });

            map = L.map('map', {
                center: [10.762622, 106.660172],
                zoom: 13,
                maxZoom: 33,
                layers: [osm]
            });

            L.control.layers({
                "OpenStreetMap": osm,
                "Satellite": satellite
            }).addTo(map);

            // Add zoom display control
            L.control.zoomDisplay = function(opts) {
                return new L.Control.ZoomDisplay(opts);
            };

            L.Control.ZoomDisplay = L.Control.extend({
                options: {
                    position: 'topright'
                },

                onAdd: function(map) {
                    this._container = L.DomUtil.create('div', 'leaflet-control-zoom-display');
                    this._container.style.backgroundColor = 'white';
                    this._container.style.padding = '5px 10px';
                    this._container.style.border = '2px solid rgba(0,0,0,0.2)';
                    this._container.style.borderRadius = '4px';
                    this._container.style.fontSize = '14px';
                    this._container.style.fontWeight = 'bold';
                    this._container.style.color = '#333';
                    this._container.style.boxShadow = '0 1px 5px rgba(0,0,0,0.4)';

                    this._updateZoom();
                    map.on('zoomend', this._updateZoom, this);

                    return this._container;
                },

                onRemove: function(map) {
                    map.off('zoomend', this._updateZoom, this);
                },

                _updateZoom: function() {
                    if (this._container) {
                        this._container.innerHTML = 'Zoom: ' + this._map.getZoom();
                    }
                }
            });

            L.control.zoomDisplay().addTo(map);

            map.addLayer(markersCluster);
            map.addLayer(labelLayerGroup);

            map.on('click', function(e) {
                if (!pendingNewMarker) return;
                pendingMarkerLocation = [e.latlng.lat, e.latlng.lng];
                promptMarkerDetails();
            });

            return map;
        }

        function addMarkersToMap(data) {
            markersCluster.clearLayers();
            labelLayerGroup.clearLayers();
            markers = [];

            data.forEach(row => {
                const name = row[1] || row[0] || '';
                const lat = parseFloat(row[2]);
                const lon = parseFloat(row[3]);
                const type = parseInt(row[6]);
                const note = row[4] || '';
                const tudieukhien = row[7];
                const loaitru = row[8];
                const loaican = row[9];
                const loaiden = row[10];

                if (isNaN(lat) || isNaN(lon)) return;

                const icon = customIcons[type] || customIcons.default;
                const markerIndex = markers.length;

                const marker = L.marker([lat, lon], { icon: icon });

                const popupContent = `
                    <div>
                        <strong>Tên trụ: ${name || 'Không có tên'}</strong><br>
                        Lat: ${lat.toFixed(6)}<br>
                        Lon: ${lon.toFixed(6)}<br>
                        Ghi chú: ${note || 'Không có'}<br>
                        Trụ: ${loaitru || ''}<br>
                        Tủ điều khiển: ${tudieukhien || ''}<br>
                        Đèn: ${loaiden || ''}<br>
                        <button onclick="routeToMarker(${markerIndex})" style="margin-top:8px;padding:6px 10px;font-size:14px;cursor:pointer;">Dẫn đường xe máy</button>
                    </div>`;

                marker.bindPopup(popupContent);
                markersCluster.addLayer(marker);

                markers.push({ lat, lon, name, note, marker });

                // Optional: Add text label
                if (name) {
                    const label = L.marker([lat, lon], {
                        icon: L.divIcon({
                            className: 'custom-label',
                            html: `<div style="font-size:12px; font-weight:bold;">${name}</div>`,
                            iconSize: [80, 20],
                            iconAnchor: [40, 30]
                        })
                    }).addTo(map);
                }
            });

            if (markers.length > 0) {
                map.fitBounds(markersCluster.getBounds().pad(0.1));
            }
        }

        function processFile(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                    const jsonData = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });
                    loadedData = jsonData;
                    addMarkersToMap(jsonData);
                } catch (error) {
                    displayError('Lỗi xử lý file Excel: ' + error.message);
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function startAddMarker() {
            if (addMarkerMode) {
                disableAddMarkerMode();
                return;
            }

            const useCurrentLocation = confirm('Sử dụng vị trí hiện tại?\n\nNhấn OK để dùng vị trí hiện tại, nhấn Cancel để chọn trên bản đồ.');
            enableAddMarkerMode();
            if (useCurrentLocation) {
                if (!navigator.geolocation) {
                    displayError('Trình duyệt không hỗ trợ định vị.');
                    disableAddMarkerMode();
                    return;
                }

                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        pendingMarkerLocation = [lat, lon];
                        promptMarkerDetails(true);
                    },
                    function(error) {
                        displayError('Không thể lấy vị trí: ' + error.message);
                        disableAddMarkerMode();
                    }
                );
            }
        }

        function promptMarkerDetails(useCurrentLocation = false) {
            const name = prompt('Nhập tên trụ mới:');
            if (!name) {
                displayError(addMarkerMode ? 'Đã hủy thêm marker. Chế độ thêm marker vẫn mở.' : 'Đã hủy thêm marker.');
                pendingNewMarker = addMarkerMode;
                pendingMarkerLocation = addMarkerMode ? null : null;
                return;
            }
            const note = prompt('Nhập ghi chú (có thể để trống):') || '';
            const type = 7;
            const newRow = ['', name, pendingMarkerLocation[0], pendingMarkerLocation[1], note, '', type, '', '', '', ''];
            loadedData.push(newRow);
            addMarkersToMap(loadedData);
            
            // Nhảy tới marker vừa tạo
            const newMarker = markers[markers.length - 1];
            if (newMarker) {
                map.setView([newMarker.lat, newMarker.lon], 19);
                newMarker.marker.openPopup();
            }
            
            displayError('Đã thêm marker mới. Nhấn nút Thêm marker để dừng, hoặc tiếp tục chọn vị trí. Nhấn Lưu dữ liệu để tải file XLSX.');
            if (addMarkerMode) {
                pendingNewMarker = true;
                pendingMarkerLocation = null;
            } else {
                pendingNewMarker = false;
                pendingMarkerLocation = null;
            }
        }

        function saveMarkerData() {
            if (!loadedData || loadedData.length === 0) {
                displayError('Không có dữ liệu để lưu.');
                return;
            }

            const worksheet = XLSX.utils.aoa_to_sheet(loadedData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, 'Sheet1');
            const wbout = XLSX.write(workbook, { bookType: 'xlsx', type: 'array' });
            const blob = new Blob([wbout], { type: 'application/octet-stream' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'khaosat-updated.xlsx';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            displayError('File dữ liệu đã được tạo và tải xuống.');
        }

        function loadDefaultFile() {
            fetch('data/khaosat.xlsx')
                .then(response => {
                    if (!response.ok) throw new Error('File không tồn tại');
                    return response.blob();
                })
                .then(blob => {
                    const file = new File([blob], 'khaosat.xlsx');
                    processFile(file);
                })
                .catch(error => {
                    displayError('Không thể tải file dữ liệu mặc định: ' + error.message);
                    console.error(error);
                });
        }

        function navigateToPage() {
            const select = document.getElementById("pages");
            if (select.value) {
                window.location.href = select.value;
            }
        }

        function normalizeText(text) {
            return (text || '').toString().normalize('NFD').replace(/\p{Diacritic}/gu, '').toLowerCase();
        }

        function clearSearchResults() {
            const results = document.getElementById('searchResults');
            if (results) {
                results.innerHTML = '';
            }
        }

        function closeControlsModal() {
            const modal = document.getElementById('controlsModal');
            if (!modal) return;

            if (typeof $ !== 'undefined' && $.fn.modal) {
                $('#controlsModal').modal('hide');
            } else {
                modal.classList.remove('show');
                modal.style.display = 'none';
                document.body.classList.remove('modal-open');
                const backdrop = document.querySelector('.modal-backdrop');
                if (backdrop) {
                    backdrop.remove();
                }
            }
        }

        function goToMarker(index) {
            const item = markers[index];
            if (!item) return;
            map.setView([item.lat, item.lon], 18);
            item.marker.openPopup();
            closeControlsModal();
        }

        function searchMarkers() {
            const rawInput = document.getElementById('searchInput').value.trim();
            clearSearchResults();
            console.log('Searching for:', rawInput);
            console.log('Total markers:', markers.length);
            console.log('First few markers:', markers.slice(0, 3));
            if (!rawInput) {
                displayError('Vui lòng nhập tên trụ hoặc tọa độ để tìm kiếm.');
                return;
            }

            const input = normalizeText(rawInput);
            const matches = [];

            for (let i = 0; i < markers.length; i++) {
                const item = markers[i];
                const itemName = normalizeText(item.name || item.label || '');
                const itemNote = normalizeText(item.note || '');
                if (itemName.includes(input) || itemNote.includes(input)) {
                    matches.push({ index: i, item });
                }
            }

            if (matches.length === 1) {
                const match = matches[0];
                map.setView([match.item.lat, match.item.lon], 18);
                match.item.marker.openPopup();
                displayError(`Tìm thấy 1 kết quả: ${match.item.name || 'Không có tên'}`);
                return;
            }

            if (matches.length > 1) {
                const firstMatch = matches[0];
                map.setView([firstMatch.item.lat, firstMatch.item.lon], 18);
                firstMatch.item.marker.openPopup();

                const results = document.getElementById('searchResults');
                const list = document.createElement('ul');
                // Hiển thị toàn bộ kết quả
                matches.forEach(match => {
                    const listItem = document.createElement('li');
                    const link = document.createElement('a');
                    link.href = '#';
                    link.textContent = `${match.item.name || 'Không có tên'} (${match.item.lat.toFixed(6)}, ${match.item.lon.toFixed(6)})`;
                    link.onclick = function(event) {
                        event.preventDefault();
                        goToMarker(match.index);
                    };
                    // Thêm event listeners cho hover effect
                    link.onmouseover = function() {
                        if (match.item.marker._icon) {
                            match.item.marker._icon.classList.add('marker-highlight');
                        }
                    };
                    link.onmouseout = function() {
                        if (match.item.marker._icon) {
                            match.item.marker._icon.classList.remove('marker-highlight');
                        }
                    };
                    listItem.appendChild(link);
                    list.appendChild(listItem);
                });
                results.appendChild(list);
                displayError(`Tìm thấy ${matches.length} kết quả. Nhấp vào danh sách để tới marker tương ứng.`);
                return;
            }

            if (rawInput.includes(',')) {
                const coords = rawInput.split(',').map(c => parseFloat(c.trim()));
                if (coords.length === 2 && !isNaN(coords[0]) && !isNaN(coords[1])) {
                    map.setView([coords[0], coords[1]], 18);
                    displayError(`Đã nhảy tới tọa độ: ${coords[0].toFixed(6)}, ${coords[1].toFixed(6)}`);
                    return;
                }
            }

            displayError('Không tìm thấy điểm nào phù hợp.');
        }

        function displayError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.style.display = message ? 'block' : 'none';
        }

        function updateCurrentLocationMarker(lat, lon) {
            currentLocation = [lat, lon];

            if (currentLocationMarker) {
                currentLocationMarker.setLatLng(currentLocation);
            } else {
                currentLocationMarker = L.marker(currentLocation, { icon: customIcons.default })
                    .addTo(map)
                    .bindPopup('Vị trí hiện tại của bạn');
            }
        }

        function clearRoute() {
            if (routeLine) {
                map.removeLayer(routeLine);
                routeLine = null;
            }
        }

        function fetchMotorbikeRoute(origin, destination) {
            const url = `https://router.project-osrm.org/route/v1/driving/${origin[1]},${origin[0]};${destination[1]},${destination[0]}?overview=full&geometries=geojson`;
            return fetch(url)
                .then(response => {
                    if (!response.ok) throw new Error('Không thể tải lộ trình.');
                    return response.json();
                })
                .then(data => {
                    if (!data.routes || data.routes.length === 0 || data.code !== 'Ok') {
                        throw new Error('Không tìm thấy lộ trình xe máy.');
                    }
                    return data.routes[0];
                });
        }

        function drawRoute(route) {
            clearRoute();

            routeLine = L.geoJSON(route.geometry, {
                style: {
                    color: 'red',
                    weight: 5,
                    opacity: 0.8
                }
            }).addTo(map);

            if (routeLine && routeLine.getBounds) {
                map.fitBounds(routeLine.getBounds().pad(0.15));
            }

            if (route.distance != null && route.duration != null) {
                const distanceKm = (route.distance / 1000).toFixed(1);
                const durationMin = Math.round(route.duration / 60);
                displayError(`Lộ trình xe máy: ${distanceKm} km, khoảng ${durationMin} phút.`);
            }
        }

        function routeToMarker(index) {
            const target = markers[index];
            if (!target) {
                displayError('Marker không tồn tại.');
                return;
            }

            function routeFromCurrentLocation() {
                fetchMotorbikeRoute(currentLocation, [target.lat, target.lon])
                    .then(route => {
                        drawRoute(route);
                        target.marker.openPopup();
                    })
                    .catch(error => {
                        displayError(error.message);
                    });
            }

            if (currentLocation) {
                routeFromCurrentLocation();
                return;
            }

            if (!navigator.geolocation) {
                displayError('Trình duyệt không hỗ trợ định vị.');
                return;
            }

            navigator.geolocation.getCurrentPosition(
                function(position) {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    updateCurrentLocationMarker(lat, lon);
                    routeFromCurrentLocation();
                },
                function(error) {
                    displayError('Không thể lấy vị trí: ' + error.message);
                }
            );
        }

        function centerOnUserLocation() {
            if (!navigator.geolocation) {
                displayError('Trình duyệt không hỗ trợ định vị.');
                return;
            }

            navigator.geolocation.getCurrentPosition(
                function(position) {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    updateCurrentLocationMarker(lat, lon);
                    map.setView([lat, lon], 19);
                },
                function(error) {
                    displayError('Không thể lấy vị trí: ' + error.message);
                }
            );
        }

        // Initialize when page loads
        window.onload = function() {
            map = initializeMap();
            loadDefaultFile();

            // Setup modal controls
            console.log('Setting up modal controls...');
            const controlsBtn = document.getElementById('controlsBtn');
            console.log('Controls button:', controlsBtn);
            if (controlsBtn) {
                controlsBtn.addEventListener('click', function() {
                    console.log('Controls button clicked');
                    // Try jQuery first, fallback to vanilla JS
                    if (typeof $ !== 'undefined' && $.fn.modal) {
                        $('#controlsModal').modal({
                            backdrop: true,
                            keyboard: true,
                            show: true
                        });
                    } else {
                        console.log('jQuery not available, using vanilla JS');
                        const modal = document.getElementById('controlsModal');
                        if (modal) {
                            modal.style.display = 'block';
                            // Force reflow before adding show class for transition
                            modal.offsetHeight;
                            modal.classList.add('show');
                            document.body.classList.add('modal-open');

                            // Add backdrop
                            const backdrop = document.createElement('div');
                            backdrop.className = 'modal-backdrop show';
                            document.body.appendChild(backdrop);

                            // Close modal when clicking backdrop or close button
                            backdrop.onclick = function() {
                                modal.classList.remove('show');
                                setTimeout(() => {
                                    modal.style.display = 'none';
                                    document.body.classList.remove('modal-open');
                                    document.body.removeChild(backdrop);
                                }, 300); // Wait for transition
                            };

                            const closeBtn = modal.querySelector('.close');
                            if (closeBtn) {
                                closeBtn.onclick = function() {
                                    modal.classList.remove('show');
                                    setTimeout(() => {
                                        modal.style.display = 'none';
                                        document.body.classList.remove('modal-open');
                                        document.body.removeChild(backdrop);
                                    }, 300); // Wait for transition
                                };
                            }
                        }
                    }
                });
                console.log('Event listener attached');
            } else {
                console.error('Controls button not found');
            }
        };
    </script>
</body>
</html>
