      <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

    <script>
        let map;
        let markersCluster = L.markerClusterGroup();
        let labelLayerGroup = L.layerGroup();
        let markers = [];
        let loadedData = [];
        let newMarkerRows = [];
        let currentLocation = null;
        let currentLocationMarker = null;
        let routeLine = null;
        let pendingNewMarker = false;
        let pendingMarkerLocation = null;
        let markerPopupLocation = null;
        let markerImageDataUrl = null;
        let markerImageFileName = '';
        let markerImagePath = '';
        let editingMarkerIndex = null;
        let addMarkerMode = false;
        let lastMarkerName = '';
        let lastMarkerNote = '';
        let lastMarkerCabinet = '';
        let lastMarkerPoleType = '';
        let lastMarkerLampType = '';
        let githubOwner = '';
        let githubRepo = '';
        let githubBranch = '';
        let githubToken = '';
        const MAX_EXCEL_TEXT_LENGTH = 32767;

        function getNextMarkerName(previousName) {
            if (!previousName) return '';
            const match = previousName.match(/^(.*?)(\d+)$/);
            if (!match) return previousName;
            const prefix = match[1];
            const number = match[2];
            const nextNumber = String(parseInt(number, 10) + 1).padStart(number.length, '0');
            return prefix + nextNumber;
        }

        function normalizeMarkerBaseName(name) {
            const base = (name || '').toString().trim().replace(/[\s\-]*\d+$/, '');
            return normalizeText(base);
        }

        function getMarkerCountByName(name) {
            if (!name) return 0;
            const normalizedBase = normalizeMarkerBaseName(name);
            return markers.reduce((acc, item) => {
                return acc + (normalizeMarkerBaseName(item.name || '') === normalizedBase ? 1 : 0);
            }, 0);
        }

        function getSameNameMarkers(name) {
            if (!name) return [];
            const normalizedBase = normalizeMarkerBaseName(name);
            return markers.filter(item => normalizeMarkerBaseName(item.name || '') === normalizedBase);
        }

        function getDistanceMeters(lat1, lon1, lat2, lon2) {
            const toRad = x => x * Math.PI / 180;
            const R = 6371e3;
            const phi1 = toRad(lat1);
            const phi2 = toRad(lat2);
            const dPhi = toRad(lat2 - lat1);
            const dLambda = toRad(lon2 - lon1);
            const a = Math.sin(dPhi / 2) * Math.sin(dPhi / 2) + Math.cos(phi1) * Math.cos(phi2) * Math.sin(dLambda / 2) * Math.sin(dLambda / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        function convertLatLonToVn2000(lat, lon) {
            const toRad = x => x * Math.PI / 180;
            const a = 6378137.0;
            const f = 1 / 298.257222101;
            const e2 = 2 * f - f * f;
            const k0 = 0.9996;
            const zone = Math.floor((lon + 180) / 6) + 1;
            const lon0 = toRad(zone * 6 - 183);
            const phi = toRad(lat);
            const lambda = toRad(lon);
            const sinPhi = Math.sin(phi);
            const cosPhi = Math.cos(phi);
            const tanPhi = Math.tan(phi);
            const N = a / Math.sqrt(1 - e2 * sinPhi * sinPhi);
            const T = tanPhi * tanPhi;
            const C = e2 / (1 - e2) * cosPhi * cosPhi;
            const A = (lambda - lon0) * cosPhi;
            const M = a * ((1 - e2 / 4 - 3 * Math.pow(e2, 2) / 64 - 5 * Math.pow(e2, 3) / 256) * phi
                - (3 * e2 / 8 + 3 * Math.pow(e2, 2) / 32 + 45 * Math.pow(e2, 3) / 1024) * Math.sin(2 * phi)
                + (15 * Math.pow(e2, 2) / 256 + 45 * Math.pow(e2, 3) / 1024) * Math.sin(4 * phi)
                - (35 * Math.pow(e2, 3) / 3072) * Math.sin(6 * phi));
            const x = k0 * N * (A + (1 - T + C) * Math.pow(A, 3) / 6 + (5 - 18 * T + T * T + 72 * C - 58 * e2 / (1 - e2)) * Math.pow(A, 5) / 120);
            const y = k0 * (M + N * tanPhi * (Math.pow(A, 2) / 2 + (5 - T + 9 * C + 4 * C * C) * Math.pow(A, 4) / 24 + (61 - 58 * T + T * T + 600 * C - 330 * e2 / (1 - e2)) * Math.pow(A, 6) / 720));
            return {
                x: x + 500000,
                y: y,
                zone: zone
            };
        }

        function normalizeKeyValue(value) {
            return String(value || '').trim().toLowerCase();
        }

        function getRowValue(row, keys, fallback = '') {
            if (row == null) return fallback;
            if (Array.isArray(row)) {
                for (const key of keys) {
                    if (typeof key === 'number' && row[key] != null && row[key] !== '') {
                        return row[key];
                    }
                }
            } else if (typeof row === 'object') {
                const normalizedKeys = Object.keys(row).reduce((acc, key) => {
                    acc[normalizeKeyValue(key)] = key;
                    return acc;
                }, {});
                for (const key of keys) {
                    if (Object.prototype.hasOwnProperty.call(row, key) && row[key] != null && row[key] !== '') {
                        return row[key];
                    }
                    const normalizedKey = normalizeKeyValue(key);
                    if (normalizedKey && normalizedKeys[normalizedKey] != null) {
                        const actualKey = normalizedKeys[normalizedKey];
                        if (row[actualKey] != null && row[actualKey] !== '') {
                            return row[actualKey];
                        }
                    }
                }
            }
            return fallback;
        }

        const rowFieldKeys = {
            id: [0, 'ID', 'Id', 'id'],
            name: [1, 'name', 'Name', 'Tên', 'tên', 'name'],
            latitude: [2, 'latitude', 'Latitude', 'lat', 'Lat'],
            longitude: [3, 'longitude', 'Longitude', 'lon', 'Lon', 'longtitude', 'Longtitude'],
            north: [4, 'N', 'n'],
            east: [5, 'E', 'e'],
            status: [6, 'trạng thái', 'trang thai', 'Status', 'status'],
            homeAddress: [7, 'địa chỉ nhà riêng', 'dia chi nha rieng', 'home address', 'Home Address'],
            officeAddress: [8, 'địa chỉ cơ quan', 'dia chi co quan', 'office address', 'Office Address'],
            phone1: [9, 'điện thoại 1', 'dien thoai 1', 'phone1', 'Phone 1'],
            phone2: [10, 'điện thoại 2', 'dien thoai 2', 'phone2', 'Phone 2'],
            facebook: [11, 'facebook', 'Facebook'],
            company: [12, 'cơ quan công tác', 'co quan cong tac', 'organization', 'Organization', 'cơ quan', 'Cơ quan công tác'],
            title: [13, 'chức vụ', 'chuc vu', 'title', 'Title'],
            image: [14, 'hình ảnh', 'hinh anh', 'image', 'Image']
        };

        function parseMarkerRow(row) {
            const id = String(getRowValue(row, rowFieldKeys.id, '')).trim();
            const name = String(getRowValue(row, rowFieldKeys.name, '')).trim();
            const latValue = getRowValue(row, rowFieldKeys.latitude, '');
            const lonValue = getRowValue(row, rowFieldKeys.longitude, '');
            const north = String(getRowValue(row, rowFieldKeys.north, '')).trim();
            const east = String(getRowValue(row, rowFieldKeys.east, '')).trim();
            const status = String(getRowValue(row, rowFieldKeys.status, '')).trim();
            const homeAddress = String(getRowValue(row, rowFieldKeys.homeAddress, '')).trim();
            const officeAddress = String(getRowValue(row, rowFieldKeys.officeAddress, '')).trim();
            const phone1 = String(getRowValue(row, rowFieldKeys.phone1, '')).trim();
            const phone2 = String(getRowValue(row, rowFieldKeys.phone2, '')).trim();
            const facebook = String(getRowValue(row, rowFieldKeys.facebook, '')).trim();
            const company = String(getRowValue(row, rowFieldKeys.company, '')).trim();
            const title = String(getRowValue(row, rowFieldKeys.title, '')).trim();
            const image = String(getRowValue(row, rowFieldKeys.image, '')).trim();

            return {
                raw: row,
                id,
                name,
                lat: parseFloat(latValue),
                lon: parseFloat(lonValue),
                north,
                east,
                status,
                homeAddress,
                officeAddress,
                phone1,
                phone2,
                facebook,
                company,
                title,
                image
            };
        }

        function rowToArray(row) {
            const parsed = parseMarkerRow(row);
            return [parsed.id, parsed.name, parsed.lat, parsed.lon, parsed.north, parsed.east, parsed.status, parsed.homeAddress, parsed.officeAddress, parsed.phone1, parsed.phone2, parsed.facebook, parsed.company, parsed.title, parsed.image];
        }

        function createMarkerPopupContent(row, rowIndex) {
            const parsed = parseMarkerRow(row);
            const id = parsed.id || 'Không có ID';
            const name = parsed.name || 'Không có tên';
            const lat = parsed.lat;
            const lon = parsed.lon;
            const north = parsed.north || '';
            const east = parsed.east || '';
            const status = parsed.status || '';
            const homeAddress = parsed.homeAddress || '';
            const officeAddress = parsed.officeAddress || '';
            const phone1 = parsed.phone1 || '';
            const phone2 = parsed.phone2 || '';
            const facebook = parsed.facebook || '';
            const company = parsed.company || '';
            const title = parsed.title || '';
            const image = parsed.image || '';

            const sameNameMarkers = getSameNameMarkers(name);
            const currentLat = lat;
            const currentLon = lon;
            const currentNameNormalized = normalizeText(name || '');
            const isAlreadyIncluded = sameNameMarkers.some(item => item.lat === currentLat && item.lon === currentLon && normalizeText(item.name || '') === currentNameNormalized);
            if (!isAlreadyIncluded) {
                sameNameMarkers.push({ lat: currentLat, lon: currentLon, name });
            }

            const sameNameCount = sameNameMarkers.length;
            const sameNameHtml = sameNameCount > 1 ? `<div style="margin-top:8px;font-size:13px;color:#333;"><strong>Tổng số điểm cùng tên:</strong> ${sameNameCount}</div>` : '';

            let distancesHtml = '';
            if (sameNameCount > 1) {
                const segments = [];
                let totalDistance = 0;
                for (let i = 1; i < sameNameMarkers.length; i++) {
                    const prev = sameNameMarkers[i - 1];
                    const current = sameNameMarkers[i];
                    const dist = getDistanceMeters(prev.lat, prev.lon, current.lat, current.lon);
                    totalDistance += dist;
                    segments.push(`<li style="margin-bottom:4px;list-style:disc;">${prev.name || 'Không có tên'} → ${current.name || 'Không có tên'}: ${Math.round(dist)} m</li>`);
                }
                distancesHtml = `<div style="margin-top:8px;font-size:13px;color:#333;"><strong>Tổng khoảng cách nối tiếp:</strong> ${Math.round(totalDistance)} m<ul style="margin:4px 0 0 16px;padding:0;">${segments.join('')}</ul></div>`;
            }

            const imageLabelHtml = `<div style="margin-top:8px;font-size:13px;color:#333;"><strong>Hình ảnh:</strong></div>`;

            const imageHtml = imageUrl ? `<div style="margin-top:4px;text-align:center;"><img src="${imageUrl}" alt="Hình ảnh" style="max-width:100%;max-height:140px;border-radius:8px;border:1px solid #ccc;" /></div>` : `<div style="margin-top:4px;font-size:13px;color:#777;">Không có ảnh</div>`;
            const imageInfoHtml = imageUrl ? `<div style="margin-top:4px;font-size:11px;color:#666;word-break:break-all;">${imageUrl}</div>` : '';
            const phoneHtml = phone1 || phone2 ? `<div style="margin-top:8px;font-size:13px;color:#333;"><strong>Điện thoại:</strong> ${phone1}${phone1 && phone2 ? '<br>' : ''}${phone2}</div>` : '';

        function normalizeImagePath(image) {
            if (!image || typeof image !== 'string') return '';
            const trimmed = image.trim();
            if (!trimmed) return '';
            const normalized = trimmed.replace(/\\/g, '/');
            if (/^data:/i.test(normalized) || /^https?:\/\//i.test(normalized) || /^\/|^\.\.\//.test(normalized) || /^\.\//.test(normalized)) {
                return normalized;
            }
            const imagesPos = normalized.toLowerCase().indexOf('images/');
            if (imagesPos !== -1) {
                return normalized.slice(imagesPos);
            }
            if (/^[a-zA-Z]:\//.test(normalized) || /^\\\\/.test(normalized)) {
                const winPath = normalized;
                return winPath.startsWith('/') ? `file://${winPath}` : `file:///${winPath}`;
            }
            if (!/\//.test(normalized)) {
                return `images/${normalized}`;
            }
            return normalized;
        }

        function createMarkerIcon(parsed) {
            const image = String(parsed.image || '').trim();
            const iconUrl = normalizeImagePath(image);
            if (iconUrl) {
                return L.icon({
                    iconUrl: iconUrl,
                    iconSize: [40, 40],
                    iconAnchor: [20, 20],
                    popupAnchor: [0, -22],
                    className: 'custom-image-icon'
                });
            }
            return customIcons[parsed.type] || customIcons.default;
        }

        function addMarkerRowToMap(row, rowIndex) {
            const parsed = parseMarkerRow(row);
            const name = parsed.name;
            const lat = parsed.lat;
            const lon = parsed.lon;
            const note = parsed.note;

            if (!Number.isFinite(lat) || !Number.isFinite(lon)) return null;

            const icon = createMarkerIcon(parsed);
            const markerIndex = Number.isInteger(rowIndex) ? rowIndex : markers.length;
            const marker = L.marker([lat, lon], { icon: icon });
            const popupContent = createMarkerPopupContent(row, markerIndex);

            marker.bindPopup(popupContent);
            marker.on('popupopen', function() {
                marker.setPopupContent(createMarkerPopupContent(row, markerIndex));
            });
            marker.on('dblclick', function() {
                openMarkerEditPopup(markerIndex);
            });
            markersCluster.addLayer(marker);

            const markerEntry = { lat, lon, name, note, marker, row, rowIndex: markerIndex, labelMarker: null };
            if (name) {
                markerEntry.labelMarker = L.marker([lat, lon], {
                    icon: L.divIcon({
                        className: 'custom-label',
                        html: `<div style="font-size:12px; font-weight:bold;">${name}</div>`,
                        iconSize: [80, 20],
                        iconAnchor: [40, 30]
                    })
                }).addTo(map);
            }

            markers.push(markerEntry);
            return marker;
        }

        function initializeMap() {

        function processFile(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                    let jsonData = XLSX.utils.sheet_to_json(firstSheet, { defval: '' });
                    if (jsonData.length > 0 && Array.isArray(jsonData[0])) {
                        jsonData = jsonData.filter(row => row && row.some(cell => cell !== null && cell !== ''));
                    } else {
                        jsonData = jsonData.filter(row => row && Object.values(row).some(cell => cell !== null && cell !== ''));
                    }
                    loadedData = jsonData;
                    addMarkersToMap(jsonData);
                } catch (error) {
                    displayError('Lỗi xử lý file Excel: ' + error.message);
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function makeElementDraggable(handle, target) {
            if (!handle || !target) return;
            let dragging = false;
            let startX = 0;
            let startY = 0;
            let origLeft = 0;
            let origTop = 0;

            handle.style.touchAction = 'none';

            handle.addEventListener('pointerdown', function(event) {
                if (event.pointerType === 'mouse' && event.button !== 0) return;
                dragging = true;
                const rect = target.getBoundingClientRect();
                origLeft = rect.left;
                origTop = rect.top;
                startX = event.clientX;
                startY = event.clientY;
                target.setPointerCapture(event.pointerId);
                target.classList.add('dragging');
                event.preventDefault();
            });

            handle.addEventListener('pointermove', function(event) {
                if (!dragging) return;
                const dx = event.clientX - startX;
                const dy = event.clientY - startY;
                target.style.left = `${origLeft + dx}px`;
                target.style.top = `${origTop + dy}px`;
                target.style.transform = 'none';
            });

            const endDrag = function(event) {
                if (!dragging) return;
                dragging = false;
                if (event.pointerId) {
                    try {
                        target.releasePointerCapture(event.pointerId);
                    } catch (e) {
                        // ignore
                    }
                }
                target.classList.remove('dragging');
            };

            handle.addEventListener('pointerup', endDrag);
            handle.addEventListener('pointercancel', endDrag);
        }

        function resizeImageDataUrl(dataUrl, callback) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                let width = img.width;
                let height = img.height;
                const maxSide = 400;
                const scale = Math.min(1, maxSide / Math.max(width, height));
                width = Math.round(width * scale);
                height = Math.round(height * scale);
                let quality = 0.92;

                const ctx = canvas.getContext('2d');

                function render() {
                    canvas.width = width;
                    canvas.height = height;
                    ctx.clearRect(0, 0, width, height);
                    ctx.drawImage(img, 0, 0, width, height);
                    const result = canvas.toDataURL('image/jpeg', quality);
                    return result;
                }

                let result = render();
                while (result.length > MAX_EXCEL_TEXT_LENGTH && quality > 0.1) {
                    quality -= 0.1;
                    result = render();
                }

                while (result.length > MAX_EXCEL_TEXT_LENGTH && Math.max(width, height) > 120) {
                    width = Math.round(width * 0.85);
                    height = Math.round(height * 0.85);
                    result = render();
                }

                if (result.length > MAX_EXCEL_TEXT_LENGTH) {
                    callback('', 'Ảnh quá lớn để lưu vào ô Excel. Vui lòng chọn ảnh nhỏ hơn hoặc chụp lại.');
                    return;
                }

                callback(result);
            };
            img.onerror = function() {
                callback('', 'Không thể đọc ảnh.');
            };
            img.src = dataUrl;
        }

        function handleMarkerImageFile(event) {

                        }
                        displayError('Ảnh đã sẵn sàng lưu vào Excel.');
                    } else {

                        markerImagePath = '';
                        markerImageFileName = '';
                        if (preview) {
                            preview.innerHTML = '';
                        }
                        displayError(errorMessage);
                    }
                });
            };
            reader.readAsDataURL(file);
        }

                    'điện thoại 1': phone1Value,
                    'điện thoại 2': phone2Value,
                    'facebook': facebookValue,
                    'chức vụ': titleValue,
                    'hình ảnh': imageData
                };

                let message = 'Đã thêm marker mới.';
                if (editingMarkerIndex !== null && editingMarkerIndex >= 0 && editingMarkerIndex < loadedData.length) {
                    loadedData[editingMarkerIndex] = rowData;
                    const markerEntry = markers[editingMarkerIndex];
                    if (markerEntry) {
                        markerEntry.row = rowData;
                        markerEntry.lat = lat;
                        markerEntry.lon = lon;
                        markerEntry.name = name;
                        markersCluster.removeLayer(markerEntry.marker);
                        markerEntry.marker.setLatLng([lat, lon]);
                        markerEntry.marker.setIcon(createMarkerIcon(parseMarkerRow(rowData)));
                        markerEntry.marker.setPopupContent(createMarkerPopupContent(rowData, editingMarkerIndex));
                        markersCluster.addLayer(markerEntry.marker);

                            markerEntry.labelMarker.setLatLng([lat, lon]);

                                className: 'custom-label',
                                html: `<div style="font-size:12px; font-weight:bold;">${name}</div>`,
                                iconSize: [80, 20],
                                iconAnchor: [40, 30]
                            }));
                        }
                    }
                    renderMarkerList(loadedData);
                    map.setView([lat, lon], 19);
                    if (markerEntry && markerEntry.marker) {
                        markerEntry.marker.openPopup();
                    }
                    message = 'Đã cập nhật marker.';
                } else {
                    loadedData.push(rowData);
                    newMarkerRows.push(rowData);
                    const newMarker = addMarkerRowToMap(rowData, loadedData.length - 1);
                    renderMarkerList(loadedData);
                    if (newMarker) {
                        map.setView([newMarker.getLatLng().lat, newMarker.getLatLng().lng], 19);

                    addMarkerMode = true;

        function createDxfForMarkers(rows) {
            const lines = [];
            const addLine = text => lines.push(text);

            addLine('0');
            addLine('SECTION');
            addLine('2');
            addLine('HEADER');
            addLine('0');
            addLine('ENDSEC');
            addLine('0');
            addLine('SECTION');
            addLine('2');
            addLine('ENTITIES');

            let previousPoint = null;
            rows.forEach((row, index) => {
                const parsed = parseMarkerRow(row);
                const name = parsed.name || `Marker ${index + 1}`;
                const rawX = parsed.lon;
                const rawY = parsed.lat;
                const label = name.replace(/\r?\n/g, ' ');

                if (!Number.isFinite(rawX) || !Number.isFinite(rawY)) return;

                const vn2000 = convertLatLonToVn2000(rawY, rawX);
                const x = vn2000.x;
                const y = vn2000.y;

                // Draw circle marker with diameter 2mm => radius 1.0 in drawing units
                addLine('0');
                addLine('CIRCLE');
                addLine('8');
                addLine('0');
                addLine('10');
                addLine(x.toFixed(6));
                addLine('20');
                addLine(y.toFixed(6));
                addLine('30');
                addLine('0');
                addLine('40');
                addLine('1.0');

                // Draw line from previous marker to current marker
                if (previousPoint) {
                    addLine('0');
                    addLine('LINE');
                    addLine('8');
                    addLine('0');
                    addLine('10');
                    addLine(previousPoint.x.toFixed(6));
                    addLine('20');
                    addLine(previousPoint.y.toFixed(6));
                    addLine('30');
                    addLine('0');
                    addLine('11');
                    addLine(x.toFixed(6));
                    addLine('21');
                    addLine(y.toFixed(6));
                    addLine('31');
                    addLine('0');
                }

                // Draw marker name text inside or near the circle
                addLine('0');
                addLine('TEXT');
                addLine('8');
                addLine('0');
                addLine('10');
                addLine(x.toFixed(6));
                addLine('20');
                addLine((y + 0.0015).toFixed(6));
                addLine('30');
                addLine('0');
                addLine('40');
                addLine('1.0');
                addLine('1');
                addLine(label);

                previousPoint = { x, y };
            });

            addLine('0');
            addLine('ENDSEC');
            addLine('0');
            addLine('EOF');
            return lines.join('\r\n');
        }

        async function getGitHubFileContent(owner, repo, path, branch, token) {
            const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${encodeURIComponent(path)}?ref=${encodeURIComponent(branch)}`;
            const response = await fetch(apiUrl, {
                method: 'GET',
                headers: {
                    Authorization: `Bearer ${token}`,
                    Accept: 'application/vnd.github+json'
                }
            });

            if (response.status === 404) {
                return { sha: null, content: null };
            }

            if (!response.ok) {
                const text = await response.text();
                throw new Error(`Không thể đọc file GitHub: ${response.status} ${response.statusText}\n${text}`);
            }

            const data = await response.json();
            return {
                sha: data.sha,
                content: data.content
            };
        }

        async function updateGitHubFile(owner, repo, path, branch, token, contentBase64, sha) {
            const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${encodeURIComponent(path)}`;
            const body = {
                message: 'Cập nhật file excel từ bản đồ',
                content: contentBase64,
                branch: branch
            };

            if (sha) {
                body.sha = sha;
            }

            const response = await fetch(apiUrl, {
                method: 'PUT',
                headers: {
                    Authorization: `token ${token}`,
                    Accept: 'application/vnd.github+json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(body)
            });

            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(`GitHub update failed: ${response.status} ${response.statusText}\n${errorText}`);
            }

            return await response.json();
        }

        async function getGitHubRepoContents(owner, repo, path, branch, token) {
            const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${encodeURIComponent(path)}?ref=${encodeURIComponent(branch)}`;
            const response = await fetch(apiUrl, {
                method: 'GET',
                headers: {
                    Authorization: `token ${token}`,
                    Accept: 'application/vnd.github+json'
                }
            });

            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(`Không thể tải danh sách GitHub: ${response.status} ${response.statusText}\n${errorText}`);
            }

            return await response.json();
        }

        function renderGitHubContents(contents, currentPath) {
            const contentsDiv = document.getElementById('githubContents');
            if (!contentsDiv) return;
            const folderPath = currentPath || '';
            const labelPath = folderPath ? folderPath : '/';
            const items = Array.isArray(contents) ? contents : [];
            let html = `<div class="github-path">Nội dung branch: <strong>${githubOwner}/${githubRepo}@${githubBranch}</strong> — Thư mục hiện tại: <strong>${labelPath}</strong></div>`;
            html += '<ul>';

            if (folderPath) {
                const parentPath = folderPath.split('/').slice(0, -1).join('/');
                html += `<li class="github-item" data-path="${parentPath}"><span class="github-item-name">.. (Lên thư mục cha)</span><span class="github-item-type">folder</span></li>`;
            }

            items.sort((a, b) => {
                if (a.type === b.type) {
                    return a.name.localeCompare(b.name, 'vi', { sensitivity: 'base' });
                }
                return a.type === 'dir' ? -1 : 1;
            });

            items.forEach(item => {
                const itemPath = folderPath ? `${folderPath}/${item.name}` : item.name;
                const itemType = item.type === 'dir' ? 'folder' : 'file';
                html += `<li class="github-item" data-path="${itemPath}" data-type="${itemType}"><span class="github-item-name">${item.name}</span><span class="github-item-type">${itemType}</span></li>`;
            });
            html += '</ul>';
            contentsDiv.innerHTML = html;

            contentsDiv.querySelectorAll('.github-item').forEach(el => {
                el.addEventListener('click', async () => {
                    const itemPath = el.getAttribute('data-path');
                    const itemType = el.getAttribute('data-type');

                    if (itemType === 'folder' || itemPath === '') {
                        await browseGitHubPath(itemPath || '');
                    } else {
                        selectGitHubFilePath(itemPath);
                    }
                });
            });
        }

        function base64ToBinary(base64) {
            const binaryString = atob(base64.replace(/\s/g, ''));
            const bytes = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            return bytes;
        }

        async function updateGitHubExcel() {
            try {
                if (!newMarkerRows || newMarkerRows.length === 0) {
                    displayError('Không có marker mới để cập nhật lên GitHub.');
                    return;
                }

                if (!githubOwner || !githubRepo || !githubBranch || !githubToken) {
                    githubOwner = prompt('Nhập GitHub owner (tên người dùng):', 'neo-era');

                    githubBranch = prompt('Nhập branch:', 'sub1');
                    if (!githubBranch) return;
                    githubToken = prompt('Nhập GitHub personal access token (repo scope):');
                    if (!githubToken) return;
                }

                const githubPathInput = document.getElementById('githubPathInput');

                if (!branchExists) {

                displayError('Đang cập nhật file trên GitHub...');

                const header = ['ID', 'name', 'latitude', 'longtitude', 'N', 'E', 'trạng thái', 'địa chỉ nhà riêng', 'địa chỉ cơ quan', 'điện thoại 1', 'điện thoại 2', 'facebook', 'cơ quan công tác', 'chức vụ', 'hình ảnh'];

                const fileData = await getGitHubFileContent(githubOwner, githubRepo, path, githubBranch, githubToken);
                let combinedRows = [header, ...newMarkerRows.map(rowToArray)];
                let sheetName = 'Sheet1';

                if (fileData.content) {
                    const workbook = XLSX.read(base64ToBinary(fileData.content), { type: 'array' });
                    sheetName = workbook.SheetNames[0] || sheetName;
                    const sheet = workbook.Sheets[sheetName];
                    const existingRows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });

                    if (existingRows.length > 0) {
                        const existingHeader = existingRows[0];
                        const existingDataRows = existingRows.slice(1);
                        combinedRows = [header, ...existingDataRows, ...newMarkerRows.map(rowToArray)];
                    }
                }

                const workbook = XLSX.utils.book_new();
                const worksheet = XLSX.utils.aoa_to_sheet(combinedRows);
                XLSX.utils.book_append_sheet(workbook, worksheet, sheetName);
                const contentBase64 = XLSX.write(workbook, { bookType: 'xlsx', type: 'base64' });

                await updateGitHubFile(githubOwner, githubRepo, path, githubBranch, githubToken, contentBase64, fileData.sha);
                newMarkerRows = [];
                pendingNewMarker = false;
                addMarkerMode = false;
                updateAddMarkerButton();
                displayError('Đã cập nhật file Excel gốc trên GitHub thành công.');
            } catch (error) {
                console.error('updateGitHubExcel error:', error);
                displayError('Lỗi khi cập nhật GitHub: ' + (error.message || error));
            }
        }

        function searchMarkers() {
            const rawInput = document.getElementById('searchInput').value.trim();
            clearSearchResults();
            console.log('Searching for:', rawInput);
            console.log('Total markers:', markers.length);
            console.log('First few markers:', markers.slice(0, 3));
            if (!rawInput) {
                displayError('Vui lòng nhập tên trụ hoặc tọa độ để tìm kiếm.');
                return;
            }

            const input = normalizeText(rawInput);
            const matches = [];

            for (let i = 0; i < markers.length; i++) {
                const item = markers[i];
                const itemName = normalizeText(item.name || item.label || '');
                const itemNote = normalizeText(item.note || '');
                if (itemName.includes(input) || itemNote.includes(input)) {
                    matches.push({ index: i, item });
                }
            }

            if (matches.length === 1) {
                const match = matches[0];
                map.setView([match.item.lat, match.item.lon], 18);
                match.item.marker.openPopup();
                displayError(`Tìm thấy 1 kết quả: ${match.item.name || 'Không có tên'}`);
                return;
            }

            if (matches.length > 1) {
                const firstMatch = matches[0];
                map.setView([firstMatch.item.lat, firstMatch.item.lon], 18);
                firstMatch.item.marker.openPopup();

                const nameCounts = matches.reduce((counts, match) => {
                    const normalized = normalizeMarkerBaseName(match.item.name || '');
                    counts[normalized] = (counts[normalized] || 0) + 1;
                    return counts;
                }, {});

                const results = document.getElementById('searchResults');
                const list = document.createElement('ul');
                // Hiển thị toàn bộ kết quả
                matches.forEach(match => {
                    const listItem = document.createElement('li');
                    const link = document.createElement('a');
                    link.href = '#';
                    const normalized = normalizeMarkerBaseName(match.item.name || '');
                    const sameCount = nameCounts[normalized] || 0;
                    const sameText = sameCount > 1 ? ` [${sameCount} cùng tên]` : '';
                    link.textContent = `${match.item.name || 'Không có tên'}${sameText} (${match.item.lat.toFixed(6)}, ${match.item.lon.toFixed(6)})`;
                    link.onclick = function(event) {
                        event.preventDefault();
                        goToMarker(match.index);
                    };
                    // Thêm event listeners cho hover effect
                    link.onmouseover = function() {
                        if (match.item.marker._icon) {
                            match.item.marker._icon.classList.add('marker-highlight');
                        }
                    };
                    link.onmouseout = function() {
                        if (match.item.marker._icon) {
                            match.item.marker._icon.classList.remove('marker-highlight');
                        }
                    };
                    listItem.appendChild(link);
                    list.appendChild(listItem);
                });
                results.appendChild(list);
                displayError(`Tìm thấy ${matches.length} kết quả. Nhấp vào danh sách để tới marker tương ứng.`);
                return;
            }

            if (rawInput.includes(',')) {
                const coords = rawInput.split(',').map(c => parseFloat(c.trim()));
                if (coords.length === 2 && !isNaN(coords[0]) && !isNaN(coords[1])) {
                    map.setView([coords[0], coords[1]], 18);
                    displayError(`Đã nhảy tới tọa độ: ${coords[0].toFixed(6)}, ${coords[1].toFixed(6)}`);
                    return;
                }
            }

            displayError('Không tìm thấy điểm nào phù hợp.');
        }

        function routeToMapCenter() {
            const destination = [map.getCenter().lat, map.getCenter().lng];

            if (!Number.isFinite(destination[0]) || !Number.isFinite(destination[1])) {
                displayError('Không thể lấy điểm đến từ trung tâm bản đồ.');
                return;
            }

            function doRoute() {
                fetchMotorbikeRoute(currentLocation, destination)
                    .then(route => {
                        drawRoute(route);
                    })
                    .catch(error => {
                        displayError(error.message);
                    });
            }

            if (currentLocation) {
                doRoute();
                return;
            }

            if (!navigator.geolocation) {
                displayError('Trình duyệt không hỗ trợ định vị.');
                return;
            }

            navigator.geolocation.getCurrentPosition(
                function(position) {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    updateCurrentLocationMarker(lat, lon);
                    doRoute();
                },
                function(error) {
                    displayError('Không thể lấy vị trí: ' + error.message);
                }
            );
        }

        function clearRoute() {
            if (routeLine) {
                map.removeLayer(routeLine);
                routeLine = null;
            }
        }

        function fetchMotorbikeRoute(origin, destination) {
            const url = `https://router.project-osrm.org/route/v1/driving/${origin[1]},${origin[0]};${destination[1]},${destination[0]}?overview=full&geometries=geojson`;
            return fetch(url)
                .then(response => {
                    if (!response.ok) throw new Error('Không thể tải lộ trình.');
                    return response.json();
                })
                .then(data => {
                    if (!data.routes || data.routes.length === 0 || data.code !== 'Ok') {
                        throw new Error('Không tìm thấy lộ trình xe máy.');
                    }
                    return data.routes[0];
                });
        }

        function drawRoute(route) {
            clearRoute();

            routeLine = L.geoJSON(route.geometry, {
                style: {
                    color: 'red',
                    weight: 5,
                    opacity: 0.8
                }
            }).addTo(map);

            if (routeLine && routeLine.getBounds) {
                map.fitBounds(routeLine.getBounds().pad(0.15));
            }

            if (route.distance != null && route.duration != null) {
                const distanceKm = (route.distance / 1000).toFixed(1);
                const durationMin = Math.round(route.duration / 60);
                displayError(`Lộ trình xe máy: ${distanceKm} km, khoảng ${durationMin} phút.`);
            }
        }

        function routeToMarker(index) {
            const target = markers[index];
            if (!target) {
                displayError('Marker không tồn tại.');
                return;
            }

            function routeFromCurrentLocation() {
                fetchMotorbikeRoute(currentLocation, [target.lat, target.lon])
                    .then(route => {
                        drawRoute(route);
                        target.marker.openPopup();
                    })
                    .catch(error => {
                        displayError(error.message);
                    });
            }

            if (currentLocation) {
                routeFromCurrentLocation();
                return;
            }

            if (!navigator.geolocation) {
                displayError('Trình duyệt không hỗ trợ định vị.');
                return;
            }

            navigator.geolocation.getCurrentPosition(
                function(position) {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    updateCurrentLocationMarker(lat, lon);
                    routeFromCurrentLocation();
                },
                function(error) {
                    displayError('Không thể lấy vị trí: ' + error.message);
                }
            );
        }

        function centerOnUserLocation() {
            if (!navigator.geolocation) {
                displayError('Trình duyệt không hỗ trợ định vị.');
                return;
            }

            navigator.geolocation.getCurrentPosition(
                function(position) {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    updateCurrentLocationMarker(lat, lon);
                    map.setView([lat, lon], 19);
                },
                function(error) {
                    displayError('Không thể lấy vị trí: ' + error.message);
                }
            );
        }

        // Initialize when page loads
        window.onload = function() {
            map = initializeMap();
            loadDefaultFile();

                const saveMarkerBtn = document.getElementById('markerPopupSave');
            const cancelMarkerBtn = document.getElementById('markerPopupCancel');
            if (saveMarkerBtn) {
                saveMarkerBtn.addEventListener('click', saveMarkerPopup);
            }
            if (cancelMarkerBtn) {
                cancelMarkerBtn.addEventListener('click', cancelMarkerPopup);
            }

            const markerPopupHeader = document.querySelector('#markerPopupForm .marker-popup-card header');
            const markerPopupCard = document.querySelector('#markerPopupForm .marker-popup-card');
            makeElementDraggable(markerPopupHeader, markerPopupCard);
        };
    </script>
</body>
</html>
