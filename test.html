<!DOCTYPE html>
<html lang="vi">
<head>
    <title>Lighting System V1.1</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#007bff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Lighting System">

    <!-- Web App Manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- Icons cho PWA -->
    <link rel="icon" href="images/fevicon.png" type="image/gif" />
    <link rel="apple-touch-icon" href="images/icon-192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="images/icon-512.png">

    <!-- Site metas -->
    <meta name="author" content="Mai Vũ Lâm">

    <!-- CSS -->
    <link rel="stylesheet" type="text/css" href="css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/jquery.mCustomScrollbar.min.css">
    <link rel="stylesheet" href="https://netdna.bootstrapcdn.com/font-awesome/4.0.3/css/font-awesome.css">
    <link rel="stylesheet" href="css/owl.carousel.min.css">
    <link rel="stylesheet" href="css/owl.theme.default.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/fancybox/2.1.5/jquery.fancybox.min.css" media="screen">

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

    <!-- Bootstrap JS and jQuery -->
    <script src="js/jquery-3.0.0.min.js"></script>
    <script src="js/bootstrap.bundle.min.js"></script>

  <style>
        /* Hiệu ứng fade cho modal và nút */
        .btn, button, .form-control {
            transition: background 0.2s, color 0.2s, box-shadow 0.2s, border 0.2s;
        }
        .btn:active, button:active {
            box-shadow: 0 2px 8px rgba(0,0,0,0.18);
        }
        /* Nút về đầu trang */
        #backToTopBtn {
            display: none;
            position: fixed;
            bottom: 24px;
            right: 18px;
            z-index: 4000;
            background: #007bff;
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            font-size: 22px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.18);
            cursor: pointer;
        }
        #backToTopBtn:active {
            background: #0056b3;
        }
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden; /* Prevent horizontal scroll on mobile */
        }

        h1 {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 18px;
            color: #2510c6;
            margin: 0;
            z-index: 3000;
            background: rgba(255, 255, 255, 0.8);
            padding: 5px 10px;
            border-radius: 4px;
            touch-action: manipulation;
        }

        #controlsBtn {
            position: fixed;
            top: 35px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3000;
            touch-action: manipulation;
        }

        .controls-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .controls-container .form-group {
            margin-bottom: 15px;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .button-group .btn {
            margin: 0;
        }

        #pages, #searchInput {
            padding: 8px;
            margin: 5px;
            font-size: 16px;
        }

        button {
            background-color: #007bff;
            color: #fff;
            border: none;
            padding: 12px 20px;
            cursor: pointer;
            font-size: 18px;
            margin: 7px;
            border-radius: 8px;
        }
        button:hover, .btn:hover {
            background-color: #0056b3;
        }

        #map {
            height: 100vh;
            width: 100%;
            touch-action: none; /* Improve touch handling on mobile */
            position: absolute;
            top: 0;
            left: 0;
        }

        .custom-crosshair-icon {
            background: transparent;
            border: none;
        }

        .marker-popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.35);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            pointer-events: auto;
        }

        .marker-popup-card {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(360px, 100%);
            max-height: calc(100vh - 30px);
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            border: 1px solid rgba(0,0,0,0.12);
        }

        .marker-popup-card header {
            padding: 10px 12px;
            background: #007bff;
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            cursor: grab;
            user-select: none;
        }

        .marker-popup-card.dragging header {
            cursor: grabbing;
        }

        .marker-popup-card .body {
            padding: 10px 12px;
            max-height: calc(100vh - 160px);
            overflow-y: auto;
        }

        .marker-popup-card .body .form-group {
            margin-bottom: 6px;
        }

        .marker-popup-card .body label {
            display: block;
            margin-bottom: 3px;
            font-weight: 600;
            font-size: 13px;
        }

        .marker-popup-card .body input,
        .marker-popup-card .body textarea {
            width: 100%;
            padding: 6px 8px;
            border: 1px solid #ced4da;
            border-radius: 8px;
            font-size: 16px;
            line-height: 1.4;
        }

        .marker-popup-card .body textarea {
            resize: vertical;
            min-height: 60px;
        }

        .marker-popup-card .footer {
            padding: 8px 12px 10px;
            display: flex;
            gap: 6px;
            justify-content: space-between;
            flex-wrap: wrap;
            background: #f8f9fa;
        }

        .marker-popup-card .footer button {
            min-width: 110px;
            flex: 1 1 calc(33.333% - 8px);
            font-size: 13px;
        }

        .marker-popup-card .coords-info {
            font-size: 12px;
            color: #555;
            margin-top: 6px;
        }

        .marker-image-preview {
            margin-top: 6px;
            display: flex;
            justify-content: center;
        }

        .marker-image-preview img {
            max-width: 100%;
            max-height: 100px;
            border-radius: 10px;
            border: 1px solid #dee2e6;
            object-fit: cover;
        }

        .marker-image-button {
            width: 100%;
            margin-top: 4px;
        }

        .leaflet-control-custom {
            z-index: 3000;
            margin-bottom: 10px;
            margin-right: 10px;
            background: transparent;
            border: 1px solid rgba(0, 0, 0, 0.18);
            border-radius: 10px;
            box-shadow: 0 1px 8px rgba(0, 0, 0, 0.18);
            padding: 6px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            touch-action: manipulation;
        }

        .leaflet-control-custom button {
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 8px;
            background: #fff;
            color: #333;
            font-size: 16px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
        }

        .leaflet-control-custom button:hover {
            background: #f0f0f0;
            transform: translateY(-1px);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
        }

        .leaflet-control-custom button i {
            pointer-events: none;
        }

        #error {
            color: red;
            text-align: center;
            margin: 10px 0;
            font-weight: bold;
        }

        #searchResults {
            margin: 10px auto;
            font-size: 15px;
            max-width: 1200px;
            text-align: left;
            max-height: 150px;
            overflow-y: auto;
        }

        #searchResults ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        #searchResults li {
            margin: 4px 0;
            padding: 5px 8px;
            border-radius: 4px;
            transition: background-color 0.2s ease;
        }

        #searchResults li:hover {
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
        }

        #searchResults a {
            color: #007bff;
            text-decoration: none;
            display: block;
        }

        #searchResults a:hover {
            text-decoration: underline;
        }

        #githubContents {
            margin: 10px auto;
            font-size: 15px;
            max-width: 1200px;
            text-align: left;
            max-height: 250px;
            overflow-y: auto;
        }

        #githubContents ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        #githubContents li {
            margin: 4px 0;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #dee2e6;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
        }

        #githubContents li:hover {
            background-color: #f8f9fa;
        }

        #githubContents .github-path {
            font-size: 14px;
            color: #555;
            margin-bottom: 8px;
        }

        #githubContents .github-item-name {
            font-weight: 600;
            color: #333;
        }

        #githubContents .github-item-type {
            font-size: 13px;
            color: #666;
        }

        .custom-label {
            background: none;
            border: none;
            box-shadow: none;
            font-weight: bold;
            color: #000;
            text-shadow: 1px 1px 2px white;
        }

        .modal {
            z-index: 1050;
        }

        .modal-backdrop {
            z-index: 1040;
        }

        .modal.show {
            display: block;
        }

        /* Modal slide in from left */
        .modal.left .modal-dialog {
            position: fixed;
            left: -100%; /* Start off-screen */
            top: 0;
            height: 100vh;
            width: 400px; /* Fixed width for sidebar */
            margin: 0;
            transition: left 0.3s ease-in-out;
        }

        .modal.left.show .modal-dialog {
            left: 0; /* Slide in from left */
        }

        .modal.left .modal-content {
            height: 100vh;
            border-radius: 0;
            border: none;
        }

        .modal.left .modal-body {
            height: calc(100vh - 60px); /* Subtract header height */
            overflow-y: auto;
        }

        /* Responsive Design */
        @media only screen and (max-width: 768px) {
            /* Ẩn các tính năng phụ trên mobile, chỉ hiện khi bấm nút "Hiện thêm" */
            .button-group .btn:not(:first-child):not(:nth-child(2)) {
                display: none;
            }
            #showMoreBtn {
                display: block !important;
            }
            h1 {
                font-size: 16px;
                top: 5px;
                left: 50%;
                transform: translateX(-50%);
                padding: 3px 8px;
            }

            #controlsBtn {
                top: 5px;
                left: 50%;
                transform: translateX(-50%);
                padding: 8px 12px;
                font-size: 14px;
            }

            .controls-container {
                gap: 10px;
            }

            .button-group {
                grid-template-columns: 1fr;
            }

            #searchResults {
                max-height: 150px;
                font-size: 14px;
            }

            .modal-dialog {
                margin: 10px;
            }

            /* Mobile modal takes full screen */
            .modal.left .modal-dialog {
                width: 100vw !important;
                left: -100vw;
            }

            .modal.left.show .modal-dialog {
                left: 0;
            }

            .marker-popup-overlay {
                padding: 8px;
            }

            .marker-popup-card {
                width: calc(100% - 14px);
                max-width: 100%;
                border-radius: 12px;
                max-height: calc(100vh - 18px);
            }

            .marker-popup-card header {
                padding: 8px 10px;
                font-size: 14px;
            }

            .marker-popup-card .body {
                padding: 8px 10px;
                max-height: calc(100vh - 150px);
            }

            .marker-popup-card .body label {
                font-size: 13px;
            }

            .marker-popup-card .body input,
            .marker-popup-card .body textarea {
                font-size: 16px;
                padding: 8px 10px;
            }

            .marker-popup-card .footer {
                padding: 8px 10px 10px;
                flex-direction: column;
                gap: 6px;
            }

            .marker-popup-card .footer button {
                min-width: 100%;
                font-size: 16px;
            }
        }

        @media only screen and (max-width: 480px) {
            #backToTopBtn {
                width: 40px;
                height: 40px;
                font-size: 18px;
                bottom: 16px;
                right: 10px;
            }
            h1 {
                font-size: 14px;
                padding: 2px 6px;
            }

            #controlsBtn {
                padding: 6px 10px;
                font-size: 12px;
            }

            #searchResults {
                max-height: 120px;
                font-size: 12px;
            }

            .marker-popup-overlay {
                padding: 8px;
            }

            .marker-popup-card {
                width: 100%;
                max-width: 100%;
                border-radius: 10px;
                max-height: calc(100vh - 16px);
            }

            .marker-popup-card header {
                padding: 8px 10px;
                font-size: 14px;
            }

            .marker-popup-card .body {
                padding: 8px 10px;
                max-height: calc(100vh - 150px);
            }

            .marker-popup-card .footer {
                padding: 8px 10px 10px;
                flex-direction: column;
                gap: 6px;
            }

            .marker-popup-card .footer button {
                min-width: 100%;
            }

            /* Mobile modal takes full screen */
            .modal.left .modal-dialog {
                width: 100vw !important;
                left: -100vw;
            }

            .modal.left.show .modal-dialog {
                left: 0;
            }
        }
        
    </style>
</head>
<body>
    <!-- <h1>BẢN ĐỒ KHẢO SÁT HỆ THỐNG CHIẾU SÁNG CÔNG CỘNG</h1> -->

    <!-- Controls Button -->
  <!-- Nút Điều khiển dạng Floating Action Button (FAB) -->
<button id="controlsBtn" class="btn btn-primary fab-btn">
    <i class="fa fa-cog"></i>
    <span class="fab-text">Điều khiển</span>
</button>
    <!-- Controls Modal -->
    <div class="modal fade left" id="controlsModal" tabindex="-1" role="dialog" aria-labelledby="controlsModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="controlsModalLabel">Điều khiển bản đồ</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div id="pageSelector" class="controls-container">
                        <div class="form-group">
                            <label for="pages">Chọn Quận:</label>
                            <select id="pages" class="form-control" onchange="navigateToPage()">
                                <option value="index.html">Trang khảo sát</option>
                                <option value="quan1.html">Quận 1</option>
                                <option value="test.html">Kế hoạch</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="searchInput">Tìm kiếm:</label>
                            <input type="text" id="searchInput" class="form-control" placeholder="Nhập tên trụ hoặc tọa độ (lat, lon)" />
                        </div>

                        <div class="button-group">
                            <button onclick="searchMarkers()" class="btn btn-success btn-block">Tìm kiếm</button>
                            <button onclick="centerOnUserLocation()" class="btn btn-info btn-block">Vị trí của tôi</button>
                            <button id="addMarkerBtn" onclick="startAddMarker()" class="btn btn-warning btn-block">Thêm marker</button>
                            <button onclick="saveMarkerData()" class="btn btn-secondary btn-block">Lưu dữ liệu</button>
                            <button onclick="showExportCadModal()" class="btn btn-dark btn-block">Export to CAD</button>
                            <button onclick="updateGitHubExcel()" class="btn btn-primary btn-block">Cập nhật GitHub</button>
                        </div>

                        <div class="form-group">
                            <label for="githubPathInput">Đường dẫn file GitHub:</label>
                            <input type="text" id="githubPathInput" class="form-control" placeholder="Ví dụ: data/khaosat.xlsx" />
                        </div>
                    </div>

                    <div id="error" class="alert alert-danger" style="display: none;"></div>
                    <div id="searchResults" class="mt-3"></div>
                    <div id="githubContents" class="mt-3"></div>

                </div>
            </div>
        </div>
    </div>
    <div id="map"></div>
    <!-- Nút về đầu trang -->
    <button id="backToTopBtn" title="Về đầu trang">↑</button>
    <!-- Export to CAD Modal -->
    <div class="modal fade" id="exportCadModal" tabindex="-1" role="dialog" aria-labelledby="exportCadModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="exportCadModalLabel">Export to CAD</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close" onclick="closeExportCadModal()">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label for="exportCadType">Chọn loại marker để xuất:</label>
                        <select id="exportCadType" class="form-control">
                            <option value="new">Chỉ marker mới nhập</option>
                            <option value="all">Tất cả marker</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="exportCadBasename">Chỉ xuất các marker cùng basename:</label>
                        <input type="text" id="exportCadBasename" class="form-control" placeholder="Nhập basename (ví dụ: T1, T2...)" />
                    </div>
                    <div id="exportCadCountInfo" style="font-size:13px;color:#007bff;margin-bottom:8px;"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeExportCadModal()">Hủy</button>
                    <button type="button" class="btn btn-primary" id="exportCadBtn">Export</button>
                </div>
            </div>
        </div>
    </div>
    <div id="markerPopupForm" class="marker-popup-overlay" role="dialog" aria-modal="true">
        <div class="marker-popup-card">
            <header>Thông tin marker mới</header>
            <div class="body">
                <div class="form-group">
                    <label for="markerNameInput">Tên trụ</label>
                    <input id="markerNameInput" type="text" class="form-control" placeholder="Nhập tên trụ" />
                </div>
                <div class="form-group">
                    <label for="markerBaseSelect">Chọn marker gốc để tính khoảng cách (cùng basename):</label>
                    <select id="markerBaseSelect" class="form-control">
                        <option value="">(Mặc định: marker trước đó)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="markerCabinetInput">Tên tủ điều khiển</label>
                    <input id="markerCabinetInput" type="text" class="form-control" placeholder="Nhập tên tủ điều khiển" />
                </div>
                <div class="form-group">
                    <label for="markerPoleTypeInput">Loại trụ</label>
                    <input id="markerPoleTypeInput" type="text" class="form-control" placeholder="Nhập loại trụ" />
                </div>
                <div class="form-group">
                    <label for="markerLampTypeInput">Loại đèn</label>
                    <input id="markerLampTypeInput" type="text" class="form-control" placeholder="Nhập loại đèn" />
                </div>
                <div class="form-group">
                    <label for="markerNoteInput">Ghi chú</label>
                    <textarea id="markerNoteInput" class="form-control" placeholder="Nhập ghi chú (tùy chọn)"></textarea>
                </div>
                <div class="form-group">
                    <input id="markerImageInput" type="file" accept="image/*" capture="environment" style="display:none" onchange="handleMarkerImageFile(event)" />
                </div>
                <div class="marker-image-preview" id="markerImagePreview"></div>
                <div id="markerCoordsText" class="coords-info">Tọa độ: -</div>
            </div>
            <div class="footer">
                <!-- Hàng 1: Hủy và Lưu (2 nút chính) -->
                <div class="footer-main-actions">
                    <button id="markerPopupCancel" type="button" class="btn btn-secondary" onclick="cancelMarkerPopup()">
                        <i class="fa fa-times"></i> Hủy
                    </button>
                    <button id="markerPopupSave" type="button" class="btn btn-primary" onclick="saveMarkerPopup()">
                        <i class="fa fa-check"></i> Lưu marker
                    </button>
                </div>
                <!-- Hàng 2: Chụp ảnh -->
                <button id="markerImageButton" type="button" class="btn btn-outline-primary marker-image-button" onclick="triggerMarkerImageInput()">
                    <i class="fa fa-camera"></i> Chụp / chọn ảnh
                </button>
                <!-- Hàng 3: Vị trí (2 nút ngang) -->
                <div class="footer-location-actions">
                    <button id="markerCurrentLocationBtn" type="button" class="btn btn-info" onclick="setMarkerToCurrentLocation()">
                        <i class="fa fa-location-arrow"></i> Vị trí hiện tại
                    </button>
                    <button id="markerPickOnMapBtn" type="button" class="btn btn-warning" onclick="setMarkerToPickOnMap()">
                        <i class="fa fa-map-marker"></i> Chọn trên bản đồ
                    </button>
                </div>
            </div>
        </div>
    </div>
    <!-- ... toàn bộ HTML body cũ của bạn ... -->

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.1/exceljs.min.js"></script>

    <script>
        // === TOÀN BỘ JAVASCRIPT CŨ CỦA BẠN (giữ nguyên) ===
        // ... (paste toàn bộ code JS cũ của bạn vào đây) ...
  // --- Export to CAD Modal Logic ---
        function showExportCadModal() {
            // Reset modal fields
            document.getElementById('exportCadType').value = 'new';
            document.getElementById('exportCadBasename').value = '';
            updateExportCadCountInfo();
            // Show modal (jQuery or fallback)
            if (typeof $ !== 'undefined' && $.fn.modal) {

        function getNextMarkerName(previousName) {
            if (!previousName) return '';

        function getDistanceMeters(lat1, lon1, lat2, lon2) {
            const toRad = x => x * Math.PI / 180;
            const R = 6371e3;
            const phi1 = toRad(lat1);
            const phi2 = toRad(lat2);
            const dPhi = toRad(lat2 - lat1);
            const dLambda = toRad(lon2 - lon1);
            const a = Math.sin(dPhi / 2) * Math.sin(dPhi / 2) + Math.cos(phi1) * Math.cos(phi2) * Math.sin(dLambda / 2) * Math.sin(dLambda / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        function convertLatLonToVn2000(lat, lon) {
            const toRad = x => x * Math.PI / 180;
            const a = 6378137.0;
            const f = 1 / 298.257222101;
            const e2 = 2 * f - f * f;
            const k0 = 0.9996;
            const zone = Math.floor((lon + 180) / 6) + 1;
            const lon0 = toRad(zone * 6 - 183);
            const phi = toRad(lat);
            const lambda = toRad(lon);
            const sinPhi = Math.sin(phi);
            const cosPhi = Math.cos(phi);
            const tanPhi = Math.tan(phi);
            const N = a / Math.sqrt(1 - e2 * sinPhi * sinPhi);
            const T = tanPhi * tanPhi;
            const C = e2 / (1 - e2) * cosPhi * cosPhi;
            const A = (lambda - lon0) * cosPhi;
            const M = a * ((1 - e2 / 4 - 3 * Math.pow(e2, 2) / 64 - 5 * Math.pow(e2, 3) / 256) * phi
                - (3 * e2 / 8 + 3 * Math.pow(e2, 2) / 32 + 45 * Math.pow(e2, 3) / 1024) * Math.sin(2 * phi)
                + (15 * Math.pow(e2, 2) / 256 + 45 * Math.pow(e2, 3) / 1024) * Math.sin(4 * phi)
                - (35 * Math.pow(e2, 3) / 3072) * Math.sin(6 * phi));
            const x = k0 * N * (A + (1 - T + C) * Math.pow(A, 3) / 6 + (5 - 18 * T + T * T + 72 * C - 58 * e2 / (1 - e2)) * Math.pow(A, 5) / 120);
            const y = k0 * (M + N * tanPhi * (Math.pow(A, 2) / 2 + (5 - T + 9 * C + 4 * C * C) * Math.pow(A, 4) / 24 + (61 - 58 * T + T * T + 600 * C - 330 * e2 / (1 - e2)) * Math.pow(A, 6) / 720));
            return {
                x: x + 500000,
                y: y,
                zone: zone
            };
        }

        function createMarkerPopupContent(row) {
            const name = row[1] || row[0] || '';
            const lat = parseFloat(row[2]);
            const lon = parseFloat(row[3]);
            const note = row[4] || '';
            const tudieukhien = row[7];
            const loaitru = row[8];
            const loaiden = row[10];
            const imageValue = row[11] || '';
            const updatedAt = row[12] || '';
            const sameNameMarkers = getSameNameMarkers(name);
            const currentLat = lat;
            const currentLon = lon;
            const currentNameNormalized = normalizeText(name || '');
            const isAlreadyIncluded = sameNameMarkers.some(item => item.lat === currentLat && item.lon === currentLon && normalizeText(item.name || '') === currentNameNormalized);
            if (!isAlreadyIncluded) {
                sameNameMarkers.push({ lat: currentLat, lon: currentLon, name });
            }
            const sameNameCount = sameNameMarkers.length;
            const sameNameHtml = sameNameCount > 1 ? `<div style="margin-top:8px;font-size:13px;color:#333;"><strong>Tổng số trụ cùng tên:</strong> ${sameNameCount}</div>` : '';

            let distancesHtml = '';
            if (sameNameCount > 1) {
                // Lấy danh sách marker cùng basename, loại bỏ các marker có trường 'Tên marker gốc' (cột 13 hoặc 14)
                // row: ['', name, lat, lon, note, '', type, cabinetName, poleType, '', lampType, imageData, updatedAt, baseMarkerName, distanceToBase]
                const filtered = sameNameMarkers.filter(m => {
                    // Nếu là row gốc (object), không có cột 13/14, luôn giữ lại
                    if (!Array.isArray(m)) return true;
                    // Nếu có cột 13 (baseMarkerName) và nó khác rỗng, loại bỏ khỏi chuỗi nối tiếp
                    return !m[13];
                });
                const segments = [];
                let totalDistance = 0;
                for (let i = 1; i < filtered.length; i++) {
                    const prev = filtered[i - 1];
                    const current = filtered[i];
                    const dist = getDistanceMeters(prev.lat || parseFloat(prev[2]), prev.lon || parseFloat(prev[3]), current.lat || parseFloat(current[2]), current.lon || parseFloat(current[3]));
                    totalDistance += dist;
                    segments.push(`<li style="margin-bottom:4px;list-style:disc;">${(prev.name || prev[1] || 'Không có tên')} → ${(current.name || current[1] || 'Không có tên')}: ${Math.round(dist)} m</li>`);
                }
                distancesHtml = `<div style="margin-top:8px;font-size:13px;color:#333;"><strong>Tổng khoảng cách nối tiếp:</strong> ${Math.round(totalDistance)} m<ul style="margin:4px 0 0 16px;padding:0;">${segments.join('')}</ul></div>`;
            }

            const imagePath = (typeof imageValue === 'string' && !imageValue.startsWith('data:image/')) ? imageValue : '';
            const imageHtml = imageValue ? `<div style="margin-top:8px;text-align:center;"><img src="${imageValue}" alt="Ảnh trụ" style="max-width:100%;max-height:140px;border-radius:8px;border:1px solid #ccc;" /></div>` : '';
            const imagePathHtml = imagePath ? `<div style="margin-top:6px;font-size:12px;color:#555;word-break:break-all;text-align:center;">${imagePath}</div>` : '';
            const timestampHtml = updatedAt ? `<div style="margin-top:8px;font-size:13px;color:#333;"><strong>Thời gian cập nhật:</strong> ${updatedAt}</div>` : '';
            return `
                <div>
                    <strong>Tên trụ: ${name || 'Không có tên'}</strong><br>
                    Lat: ${lat.toFixed(6)}<br>
                    Lon: ${lon.toFixed(6)}<br>
                    Ghi chú: ${note || 'Không có'}<br>
                    Trụ: ${loaitru || ''}<br>
                    Tủ điều khiển: ${tudieukhien || ''}<br>
                    Đèn: ${loaiden || ''}<br>
                    ${sameNameHtml}
                    ${distancesHtml}
                    ${timestampHtml}
                    ${imageHtml}
                    ${imagePathHtml}
                </div>`;
        }

        function updateMarkerCoordinatesInData(markerName, newLat, newLon) {
            // Update in loadedData array
            if (Array.isArray(loadedData)) {
                loadedData.forEach(row => {
                    if (Array.isArray(row) && (row[1] === markerName || row[0] === markerName)) {
                        row[2] = newLat;
                        row[3] = newLon;
                    }
                });
            }
            // Update in newMarkerRows array
            if (Array.isArray(newMarkerRows)) {
                newMarkerRows.forEach(row => {
                    if (Array.isArray(row) && (row[1] === markerName || row[0] === markerName)) {
                        row[2] = newLat;
                        row[3] = newLon;
                    }
                });
            }
        }

        function addMarkerRowToMap(row) {
            const name = row[1] || row[0] || '';
            const lat = parseFloat(row[2]);
            const lon = parseFloat(row[3]);
            const type = parseInt(row[6]);
            const note = row[4] || '';
            const tudieukhien = row[7];
            const loaitru = row[8];
            const loaican = row[9];
            const loaiden = row[10];
            const imageBase64 = row[11] || '';
            const updatedAt = row[12] || '';

            if (isNaN(lat) || isNaN(lon)) return null;

            const icon = customIcons[type] || customIcons.default;
            const markerIndex = markers.length;
            const marker = L.marker([lat, lon], { icon: icon, draggable: true });
            const popupContent = createMarkerPopupContent(row);

            marker.bindPopup(popupContent);
            marker.on('popupopen', function() {
                marker.setPopupContent(createMarkerPopupContent(row));
            });
            
            // Enable dragging for newly added markers - update coordinates on drag end
            marker.on('dragend', function(e) {
                const newLatLng = e.target.getLatLng();
                const newLat = newLatLng.lat;
                const newLon = newLatLng.lng;
                
                // Update in markers array
                const markerData = markers.find(m => m.marker === marker);
                if (markerData) {
                    markerData.lat = newLat;
                    markerData.lon = newLon;
                }
                
                // Update coordinates in data arrays
                updateMarkerCoordinatesInData(name, newLat, newLon);
                
                // Update the popup content with new coordinates
                marker.setPopupContent(createMarkerPopupContent(row));
                
                // Update all labels with the same name (move them to new position)
                const labelLayers = labelLayerGroup.getLayers();
                labelLayers.forEach(layer => {
                    const layerHtml = layer.getIcon().options.html;
                    if (layerHtml && layerHtml.includes(name)) {
                        layer.setLatLng([newLat, newLon]);
                    }
                });
                
                // Show message
                displayError(`Marker "${name}" đã di chuyển đến (${newLat.toFixed(6)}, ${newLon.toFixed(6)})`);
            });
            
            markersCluster.addLayer(marker);
            markers.push({ lat, lon, name, note, marker });

            if (name) {
                const label = L.marker([lat, lon], {
                    icon: L.divIcon({
                        className: 'custom-label',
                        html: `<div style="font-size:12px; font-weight:bold;">${name}</div>`,
                        iconSize: [80, 20],
                        iconAnchor: [40, 30]
                    }),
                    interactive: false
                });
                labelLayerGroup.addLayer(label);
            }
                    // Ẩn/hiện label theo zoom
                    map.on('zoomend', function() {
                        if (map.getZoom() < 17) {
                            map.removeLayer(labelLayerGroup);
                        } else {
                            map.addLayer(labelLayerGroup);
                        }
                    });
                    // Khởi tạo trạng thái label khi load map
                    if (map.getZoom() < 17) {
                        map.removeLayer(labelLayerGroup);
                    } else {
                        map.addLayer(labelLayerGroup);
                    }
            // Lazy load ảnh marker nếu có
            setTimeout(() => {
                const imgs = document.querySelectorAll('.marker-image-preview img, .marker-popup-card img');
                imgs.forEach(img => {
                    if (!img.hasAttribute('loading')) img.setAttribute('loading', 'lazy');
                });
            }, 100);

            return marker;
        }

                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                    const jsonData = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });
                    loadedData = jsonData;
                    addMarkersToMap(jsonData);
                } catch (error) {
                    displayError('Lỗi xử lý file Excel: ' + error.message);

            };
            reader.readAsArrayBuffer(file);

        function makeElementDraggable(handle, target) {
            if (!handle || !target) return;
            let dragging = false;
            let startX = 0;
            let startY = 0;
            let origLeft = 0;
            let origTop = 0;

            handle.style.touchAction = 'none';

            handle.addEventListener('pointerdown', function(event) {
                if (event.pointerType === 'mouse' && event.button !== 0) return;
                dragging = true;
                const rect = target.getBoundingClientRect();
                origLeft = rect.left;
                origTop = rect.top;
                startX = event.clientX;
                startY = event.clientY;
                target.setPointerCapture(event.pointerId);
                target.classList.add('dragging');
                event.preventDefault();
            });

            handle.addEventListener('pointermove', function(event) {
                if (!dragging) return;
                const dx = event.clientX - startX;
                const dy = event.clientY - startY;
                target.style.left = `${origLeft + dx}px`;
                target.style.top = `${origTop + dy}px`;
                target.style.transform = 'none';
            });

            const endDrag = function(event) {
                if (!dragging) return;
                dragging = false;
                if (event.pointerId) {
                    try {
                        target.releasePointerCapture(event.pointerId);
                    } catch (e) {
                        // ignore
                    }
                }
                target.classList.remove('dragging');
            };

            handle.addEventListener('pointerup', endDrag);
            handle.addEventListener('pointercancel', endDrag);
        }

        function resizeImageDataUrl(dataUrl, callback) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                let width = img.width;
                let height = img.height;
                const maxSide = 400;
                const scale = Math.min(1, maxSide / Math.max(width, height));
                width = Math.round(width * scale);
                height = Math.round(height * scale);

                const ctx = canvas.getContext('2d');
                const originalMimeMatch = dataUrl.match(/^data:(image\/[^;]+);base64,/i);
                const originalMime = originalMimeMatch ? originalMimeMatch[1].toLowerCase() : 'image/png';
                const supportedMimes = ['image/png', 'image/jpeg', 'image/webp'];
                const targetMime = supportedMimes.includes(originalMime) ? originalMime : 'image/png';

                function render() {
                    canvas.width = width;
                    canvas.height = height;
                    ctx.clearRect(0, 0, width, height);
                    ctx.drawImage(img, 0, 0, width, height);
                    if (targetMime === 'image/jpeg' || targetMime === 'image/webp') {
                        return canvas.toDataURL(targetMime, 0.8);
                    }
                    return canvas.toDataURL(targetMime);
                }

                let result = render();
                while (result.length > MAX_EXCEL_TEXT_LENGTH && Math.max(width, height) > 120) {
                    width = Math.round(width * 0.85);
                    height = Math.round(height * 0.85);
                    result = render();
                }

                if (result.length > MAX_EXCEL_TEXT_LENGTH) {
                    callback('', 'Ảnh quá lớn để lưu vào ô Excel. Vui lòng chọn ảnh nhỏ hơn hoặc chụp lại.');
                    return;
                }

                callback(result);
            };
            img.onerror = function() {
                callback('', 'Không thể đọc ảnh.');
            };
            img.src = dataUrl;
        }

        function handleMarkerImageFile(event) {
            const file = event.target.files && event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                resizeImageDataUrl(e.target.result, function(resizedDataUrl, errorMessage) {
                    const preview = document.getElementById('markerImagePreview');
                    if (resizedDataUrl) {
                        markerImageDataUrl = resizedDataUrl;
                        if (preview) {

                    } else {
                        markerImageDataUrl = '';
                        if (preview) {
                            preview.innerHTML = '';
                        }
                        displayError(errorMessage);
                    }
                });
            };
            reader.readAsDataURL(file);
        }

        function createDxfForMarkers(rows) {
            const lines = [];
            const addLine = text => lines.push(text);

            addLine('0');
            addLine('SECTION');
            addLine('2');
            addLine('HEADER');
            addLine('0');
            addLine('ENDSEC');
            addLine('0');
            addLine('SECTION');
            addLine('2');
            addLine('ENTITIES');

            let previousPoint = null;
            let previousName = '';
            rows.forEach((row, index) => {
                const name = row[1] || row[0] || `Marker ${index + 1}`;
                const rawX = parseFloat(row[3]);
                const rawY = parseFloat(row[2]);
                const label = name.replace(/\r?\n/g, ' ');
                if (!Number.isFinite(rawX) || !Number.isFinite(rawY)) return;
                const vn2000 = convertLatLonToVn2000(rawY, rawX);
                const x = vn2000.x;
                const y = vn2000.y;
                // Draw circle marker
                addLine('0');
                addLine('CIRCLE');
                addLine('8');
                addLine('0');
                addLine('10');
                addLine(x.toFixed(6));
                addLine('20');
                addLine(y.toFixed(6));
                addLine('30');
                addLine('0');
                addLine('40');
                addLine('1.0');
                // Draw line and distance text from previous marker
                if (previousPoint) {
                    addLine('0');
                    addLine('LINE');
                    addLine('8');
                    addLine('0');
                    addLine('10');
                    addLine(previousPoint.x.toFixed(6));
                    addLine('20');
                    addLine(previousPoint.y.toFixed(6));
                    addLine('30');
                    addLine('0');
                    addLine('11');
                    addLine(x.toFixed(6));
                    addLine('21');
                    addLine(y.toFixed(6));
                    addLine('31');
                    addLine('0');
                    // Tính khoảng cách và vẽ text trên line
                    const dx = x - previousPoint.x;
                    const dy = y - previousPoint.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    // Vị trí text: trung điểm đoạn thẳng
                    const midX = (x + previousPoint.x) / 2;
                    const midY = (y + previousPoint.y) / 2;
                    addLine('0');
                    addLine('TEXT');
                    addLine('8');
                    addLine('0');
                    addLine('10');
                    addLine(midX.toFixed(6));
                    addLine('20');
                    addLine(midY.toFixed(6));
                    addLine('30');
                    addLine('0');
                    addLine('40');
                    addLine('1.0');
                    addLine('1');
                    addLine(`${Math.round(dist)}m`);
                }
                // Draw marker name text inside or near the circle
                addLine('0');
                addLine('TEXT');
                addLine('8');
                addLine('0');
                addLine('10');
                addLine(x.toFixed(6));
                addLine('20');
                addLine((y + 0.0015).toFixed(6));
                addLine('30');
                addLine('0');
                addLine('40');
                addLine('1.0');
                addLine('1');
                addLine(label);
                previousPoint = { x, y };
                previousName = name;
            });

            addLine('0');
            addLine('ENDSEC');
            addLine('0');
            addLine('EOF');
            return lines.join('\r\n');
        }

        function getImageExtensionFromDataUrl(dataUrl) {
            const match = dataUrl.match(/^data:image\/(png|jpeg|jpg|webp);base64,/i);
            if (!match) return 'png';
            return match[1].toLowerCase() === 'jpg' ? 'jpeg' : match[1].toLowerCase();
        }

        function sanitizeFileName(name) {
            return (name || 'marker')
                .toString()
                .trim()
                .toLowerCase()
                .replace(/\s+/g, '-')
                .replace(/[^a-z0-9\-_.]/g, '')
                .replace(/\-+/g, '-')
                .replace(/^[-_.]+|[-_.]+$/g, '') || 'marker';
        }

        function getImagePathForMarker(name, dataUrl) {
            const extension = getImageExtensionFromDataUrl(dataUrl);
            const safeName = sanitizeFileName(name);
            const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
            return `images/${safeName || 'marker'}-${timestamp}.${extension}`;
        }

        function downloadDataUrlFile(dataUrl, suggestedPath) {
            try {

                fetch(dataUrl)

        }

        function getBase64FromDataUrl(dataUrl) {

        }

        async function uploadGitHubImageFile(owner, repo, path, branch, token, dataUrl, message) {
            if (!dataUrl || typeof dataUrl !== 'string' || !dataUrl.startsWith('data:image/')) {
                return null;
            }
            const contentBase64 = getBase64FromDataUrl(dataUrl);
            const existing = await getGitHubFileContent(owner, repo, path, branch, token);
            const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${encodeURIComponent(path)}`;
            const body = {
                message: message || `Upload image ${path}`,
                content: contentBase64,
                branch: branch
            };
            if (existing.sha) {
                body.sha = existing.sha;
            }
            const response = await fetch(apiUrl, {
                method: 'PUT',
                headers: {
                    Authorization: `token ${token}`,
                    Accept: 'application/vnd.github+json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(body)
            });
            if (!response.ok) {
                const text = await response.text();
                throw new Error(`Không thể tải ảnh lên GitHub: ${response.status} ${response.statusText}\n${text}`);
            }
            return await response.json();
        }

        async function prepareImagePathsForGitHub(rows, owner, repo, branch, token) {
            if (!Array.isArray(rows)) return [];
            const uploadedImages = [];
            for (const row of rows) {
                if (!Array.isArray(row)) continue;
                const imageValue = row[11];
                if (typeof imageValue === 'string' && imageValue.startsWith('data:image/')) {
                    const markerName = row[1] || row[0] || 'marker';
                    const imagePath = getImagePathForMarker(markerName, imageValue);
                    await uploadGitHubImageFile(owner, repo, imagePath, branch, token, imageValue, `Upload marker image ${imagePath}`);
                    row[11] = imagePath;
                    uploadedImages.push(imagePath);
                }
            }
            return uploadedImages;
        }

        function prepareImagePathsForSave(rows) {
            if (!Array.isArray(rows)) return [];
            const downloadedImages = [];
            rows.forEach(row => {
                if (!Array.isArray(row)) return;
                const imageValue = row[11];
                if (typeof imageValue === 'string' && imageValue.startsWith('data:image/')) {
                    const markerName = row[1] || row[0] || 'marker';
                    const imagePath = getImagePathForMarker(markerName, imageValue);
                    row[11] = imagePath;
                    downloadedImages.push({ dataUrl: imageValue, path: imagePath });

            });
            downloadedImages.forEach(item => downloadDataUrlFile(item.dataUrl, item.path));
            return downloadedImages;
        }

        function arrayBufferToBase64(buffer) {
            let binary = '';
            const bytes = new Uint8Array(buffer);
            const chunkSize = 0x8000;
            for (let i = 0; i < bytes.length; i += chunkSize) {
                binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
            }
            return btoa(binary);
        }

        async function createExcelBufferWithImages(rows) {
            const ExcelJSGlobal = typeof ExcelJS !== 'undefined' ? ExcelJS : (typeof window !== 'undefined' ? window.ExcelJS : undefined);
            if (!ExcelJSGlobal) return null;
            const workbook = new ExcelJSGlobal.Workbook();
            const worksheet = workbook.addWorksheet('Sheet1');
            const header = ['ID', 'Tên trụ', 'Lat', 'Lon', 'Ghi chú', 'Trống', 'Loại', 'Tủ điều khiển', 'Loại trụ', 'Loại cần', 'Loại đèn', 'Ảnh', 'Thời gian cập nhật', 'Tên marker gốc', 'Khoảng cách (m)'];
            worksheet.addRow(header);

            const columnWidths = [8, 20, 12, 12, 24, 8, 10, 18, 14, 12, 14, 24, 20, 20, 16];
            columnWidths.forEach((width, index) => {
                worksheet.getColumn(index + 1).width = width;
            });

            for (let i = 0; i < rows.length; i++) {
                const row = Array.isArray(rows[i]) ? [...rows[i]] : [];
                const imageData = row[11] || '';
                const excelRowData = [...row];
                if (typeof imageData === 'string' && imageData.startsWith('data:image/')) {
                    excelRowData[11] = '';
                }

                const excelRow = worksheet.addRow(excelRowData);
                if (typeof imageData === 'string' && imageData.startsWith('data:image/')) {
                    const extension = getImageExtensionFromDataUrl(imageData);
                    const base64Data = imageData.replace(/^data:image\/[^;]+;base64,/, '');
                    const imageId = workbook.addImage({ base64: base64Data, extension });
                    const rowNumber = excelRow.number;
                    worksheet.addImage(imageId, {
                        tl: { col: 11, row: rowNumber - 1 },
                        ext: { width: 180, height: 120 },
                        editAs: 'oneCell'
                    });
                    worksheet.getRow(rowNumber).height = 95;
                }
            }

            return await workbook.xlsx.writeBuffer();
        }

        function attachImagesToWorksheet(worksheet, rows, startRow = 1) {
            if (!worksheet || !Array.isArray(rows)) return;
            const images = [];
            rows.forEach((row, index) => {
                const imageData = row[11];
                const rowIndex = startRow + index;
                const cellAddress = XLSX.utils.encode_cell({ r: rowIndex, c: 11 });

                if (typeof imageData === 'string' && imageData.startsWith('data:image/')) {
                    worksheet[cellAddress] = { t: 's', v: '' };

                    images.push({
                        image: imageData,
                        origin: { r: rowIndex, c: 11 },
                        base64: true
                    });

                    worksheet['!cols'] = worksheet['!cols'] || [];
                    worksheet['!cols'][11] = { wpx: 140 };
                    worksheet['!rows'] = worksheet['!rows'] || [];
                    worksheet['!rows'][rowIndex] = { hpx: 120 };
                } else if (typeof imageData === 'string' && imageData) {
                    worksheet[cellAddress] = { t: 's', v: imageData };
                }
            });
            if (images.length > 0) {
                worksheet['!images'] = images;
            }
        }

                    const exportRows = newMarkerRows.map(row => Array.isArray(row) ? [...row] : []);
                    const exportData = [header, ...exportRows];
                    const worksheet = XLSX.utils.aoa_to_sheet(exportData);
                    attachImagesToWorksheet(worksheet, newMarkerRows);
                    const workbook = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(workbook, worksheet, 'Sheet1');
                    if (typeof XLSX.writeFile === 'function') {
                        XLSX.writeFile(workbook, 'khaosat-updated.xlsx');
                    } else {
                        const wbout = XLSX.write(workbook, { bookType: 'xlsx', type: 'array' });
                        const blob = new Blob([wbout], { type: 'application/octet-stream' });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.style.display = 'none';
                        a.href = url;
                        a.download = 'khaosat-updated.xlsx';
                        document.body.appendChild(a);
                        a.click();
                        setTimeout(() => {
                            document.body.removeChild(a);
                            URL.revokeObjectURL(url);
                        }, 100);
                    }
                }

                displayError('File dữ liệu mới đã được tạo và tải xuống.');
            } catch (error) {
                console.error('saveMarkerData error:', error);
                displayError('Lỗi khi tải file dữ liệu: ' + (error.message || error));
            }
        }

        async function getGitHubFileContent(owner, repo, path, branch, token) {
            const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${encodeURIComponent(path)}`;
            const response = await fetch(apiUrl, {
                method: 'GET',
                headers: {
                    Authorization: `Bearer ${token}`,
                    Accept: 'application/vnd.github+json'
                }
            });

            if (response.status === 404) {
                return { sha: null, content: null };
            }

            if (!response.ok) {
                const text = await response.text();
                throw new Error(`Không thể đọc file GitHub: ${response.status} ${response.statusText}\n${text}`);
            }

            const data = await response.json();
            return {
                sha: data.sha,
                content: data.content
            };
        }

        async function updateGitHubFile(owner, repo, path, branch, token, contentBase64, sha) {
            const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${encodeURIComponent(path)}`;
            const body = {
                message: 'Cập nhật file excel từ bản đồ',
                content: contentBase64,
                branch: branch
            };

            if (sha) {
                body.sha = sha;
            }

            const response = await fetch(apiUrl, {
                method: 'PUT',
                headers: {
                    Authorization: `token ${token}`,
                    Accept: 'application/vnd.github+json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(body)
            });

            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(`GitHub update failed: ${response.status} ${response.statusText}\n${errorText}`);
            }

            return await response.json();
        }

        async function getGitHubRepoContents(owner, repo, path, branch, token) {
            const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${encodeURIComponent(path)}?ref=${encodeURIComponent(branch)}`;
            const response = await fetch(apiUrl, {
                method: 'GET',
                headers: {
                    Authorization: `token ${token}`,
                    Accept: 'application/vnd.github+json'
                }
            });

            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(`Không thể tải danh sách GitHub: ${response.status} ${response.statusText}\n${errorText}`);
            }

            return await response.json();
        }

        function renderGitHubContents(contents, currentPath) {
            const contentsDiv = document.getElementById('githubContents');
            if (!contentsDiv) return;
            const folderPath = currentPath || '';
            const labelPath = folderPath ? folderPath : '/';
            const items = Array.isArray(contents) ? contents : [];
            let html = `<div class="github-path">Nội dung branch: <strong>${githubOwner}/${githubRepo}@${githubBranch}</strong> — Thư mục hiện tại: <strong>${labelPath}</strong></div>`;
            html += '<ul>';

            if (folderPath) {
                const parentPath = folderPath.split('/').slice(0, -1).join('/');
                html += `<li class="github-item" data-path="${parentPath}"><span class="github-item-name">.. (Lên thư mục cha)</span><span class="github-item-type">folder</span></li>`;
            }

            items.sort((a, b) => {
                if (a.type === b.type) {
                    return a.name.localeCompare(b.name, 'vi', { sensitivity: 'base' });
                }
                return a.type === 'dir' ? -1 : 1;
            });

            items.forEach(item => {
                const itemPath = folderPath ? `${folderPath}/${item.name}` : item.name;
                const itemType = item.type === 'dir' ? 'folder' : 'file';
                html += `<li class="github-item" data-path="${itemPath}" data-type="${itemType}"><span class="github-item-name">${item.name}</span><span class="github-item-type">${itemType}</span></li>`;
            });
            html += '</ul>';
            contentsDiv.innerHTML = html;

            contentsDiv.querySelectorAll('.github-item').forEach(el => {
                el.addEventListener('click', async () => {
                    const itemPath = el.getAttribute('data-path');
                    const itemType = el.getAttribute('data-type');

                    if (itemType === 'folder' || itemPath === '') {
                        await browseGitHubPath(itemPath || '');
                    } else {
                        selectGitHubFilePath(itemPath);
                    }
                });
            });
        }

        async function checkGitHubBranchExists(owner, repo, branch, token) {
            const apiUrl = `https://api.github.com/repos/${owner}/${repo}/branches/${encodeURIComponent(branch)}`;
            const response = await fetch(apiUrl, {
                method: 'GET',
                headers: {

                    Accept: 'application/vnd.github+json'
                }
            });

            return response.ok;

        function base64ToBinary(base64) {
            const binaryString = atob(base64.replace(/\s/g, ''));
            const bytes = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            return bytes;
        }

        async function updateGitHubExcel() {
            try {
                if (!newMarkerRows || newMarkerRows.length === 0) {
                    displayError('Không có marker mới để cập nhật lên GitHub.');

                   // githubBranch = prompt('Nhập branch:', 'sub1');
                    githubBranch = 'sub1';

                }

                displayError('Đang cập nhật file trên GitHub...');

                await prepareImagePathsForGitHub(newMarkerRows, githubOwner, githubRepo, githubBranch, githubToken);

                const header = ['ID', 'Tên trụ', 'Lat', 'Lon', 'Ghi chú', 'Trống', 'Loại', 'Tủ điều khiển', 'Loại trụ', 'Loại cần', 'Loại đèn', 'Ảnh', 'Thời gian cập nhật'];

                const fileData = await getGitHubFileContent(githubOwner, githubRepo, path, githubBranch, githubToken);
                let combinedRows = [header, ...newMarkerRows];
                let sheetName = 'Sheet1';

                if (fileData.content) {
                    const workbook = XLSX.read(base64ToBinary(fileData.content), { type: 'array' });

                    attachImagesToWorksheet(worksheet, combinedRows.slice(1));
                    XLSX.utils.book_append_sheet(workbook, worksheet, sheetName);
                    contentBase64 = XLSX.write(workbook, { bookType: 'xlsx', type: 'base64' });

                await updateGitHubFile(githubOwner, githubRepo, path, githubBranch, githubToken, contentBase64, fileData.sha);

            } catch (error) {

            }
        }

        function searchMarkers() {
            const rawInput = document.getElementById('searchInput').value.trim();
            clearSearchResults();
            console.log('Searching for:', rawInput);
            console.log('Total markers:', markers.length);
            console.log('First few markers:', markers.slice(0, 3));
            if (!rawInput) {
                displayError('Vui lòng nhập tên trụ hoặc tọa độ để tìm kiếm.');
                return;
            }

            const input = normalizeText(rawInput);
            const matches = [];

            for (let i = 0; i < markers.length; i++) {
                const item = markers[i];
                const itemName = normalizeText(item.name || item.label || '');
                const itemNote = normalizeText(item.note || '');
                if (itemName.includes(input) || itemNote.includes(input)) {
                    matches.push({ index: i, item });
                }
            }

            if (matches.length === 1) {
                const match = matches[0];
                map.setView([match.item.lat, match.item.lon], 18);
                match.item.marker.openPopup();
                displayError(`Tìm thấy 1 kết quả: ${match.item.name || 'Không có tên'}`);
                return;
            }

            if (matches.length > 1) {
                const firstMatch = matches[0];
                map.setView([firstMatch.item.lat, firstMatch.item.lon], 18);
                firstMatch.item.marker.openPopup();

                const nameCounts = matches.reduce((counts, match) => {
                    const normalized = normalizeMarkerBaseName(match.item.name || '');
                    counts[normalized] = (counts[normalized] || 0) + 1;
                    return counts;
                }, {});

                const results = document.getElementById('searchResults');
                const list = document.createElement('ul');
                // Hiển thị toàn bộ kết quả
                matches.forEach(match => {
                    const listItem = document.createElement('li');
                    const link = document.createElement('a');
                    link.href = '#';
                    const normalized = normalizeMarkerBaseName(match.item.name || '');
                    const sameCount = nameCounts[normalized] || 0;
                    const sameText = sameCount > 1 ? ` [${sameCount} cùng tên]` : '';
                    link.textContent = `${match.item.name || 'Không có tên'}${sameText} (${match.item.lat.toFixed(6)}, ${match.item.lon.toFixed(6)})`;
                    link.onclick = function(event) {
                        event.preventDefault();
                        goToMarker(match.index);
                    };
                    // Thêm event listeners cho hover effect
                    link.onmouseover = function() {
                        if (match.item.marker._icon) {
                            match.item.marker._icon.classList.add('marker-highlight');
                        }
                    };
                    link.onmouseout = function() {
                        if (match.item.marker._icon) {
                            match.item.marker._icon.classList.remove('marker-highlight');
                        }
                    };
                    listItem.appendChild(link);
                    list.appendChild(listItem);
                });
                results.appendChild(list);
                displayError(`Tìm thấy ${matches.length} kết quả. Nhấp vào danh sách để tới marker tương ứng.`);
                return;
            }

            if (rawInput.includes(',')) {
                const coords = rawInput.split(',').map(c => parseFloat(c.trim()));
                if (coords.length === 2 && !isNaN(coords[0]) && !isNaN(coords[1])) {
                    map.setView([coords[0], coords[1]], 18);
                    displayError(`Đã nhảy tới tọa độ: ${coords[0].toFixed(6)}, ${coords[1].toFixed(6)}`);
                    return;
                }
            }

            displayError('Không tìm thấy điểm nào phù hợp.');
        }

        function displayError(message) {

            errorDiv.style.display = message ? 'block' : 'none';
