        // --- Tracking vị trí hiện tại ---
        let currentLocationWatchId = null;
        function startTrackingCurrentLocation() {
            if (!navigator.geolocation) {
                displayError('Trình duyệt không hỗ trợ định vị.');
                return;
            }
            if (currentLocationWatchId !== null) return; // Đã tracking
            currentLocationWatchId = navigator.geolocation.watchPosition(
                function(position) {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    updateCurrentLocationMarker(lat, lon);
                },
                function(error) {
                    displayError('Không thể lấy vị trí: ' + error.message);
                },
                { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 }
            );
            displayError('Đang theo dõi vị trí hiện tại...');
        }

        function stopTrackingCurrentLocation() {
            if (currentLocationWatchId !== null) {
                navigator.geolocation.clearWatch(currentLocationWatchId);
                currentLocationWatchId = null;
                displayError('Đã dừng theo dõi vị trí.');
            }
        }

        function updateCurrentLocationMarker(lat, lon) {
            currentLocation = [lat, lon];
            if (currentLocationMarker) {
                currentLocationMarker.setLatLng(currentLocation);
            } else {
                currentLocationMarker = L.marker(currentLocation, { icon: customIcons.currentPos })
                    .addTo(map)
                    .bindPopup('Vị trí hiện tại của bạn');
            }
            // Tự động pan tới vị trí mới nếu tracking
            if (currentLocationWatchId !== null) {
                map.setView(currentLocation, Math.max(map.getZoom(), 17));
            }
        }

        function createMapControls() {
            const CustomControl = L.Control.extend({
                options: {
                    position: 'bottomright'
                },
                onAdd: function(map) {
                    const container = L.DomUtil.create('div', 'leaflet-control-custom');
                    L.DomEvent.disableClickPropagation(container);
                    L.DomEvent.disableScrollPropagation(container);

                    // Nút tracking vị trí hiện tại
                    const trackingBtn = L.DomUtil.create('button', '', container);
                    trackingBtn.type = 'button';
                    trackingBtn.title = 'Bật/tắt tracking vị trí hiện tại';
                    trackingBtn.innerHTML = '<i class="fa fa-street-view"></i>';
                    trackingBtn.style.background = '#28a745';
                    trackingBtn.style.color = '#fff';
                    let trackingActive = false;
                    trackingBtn.onclick = function() {
                        if (!trackingActive) {
                            startTrackingCurrentLocation();
                            trackingBtn.style.background = '#dc3545';
                            trackingActive = true;
                        } else {
                            stopTrackingCurrentLocation();
                            trackingBtn.style.background = '#28a745';
                            trackingActive = false;
                        }
                    };

                    // Nút về vị trí hiện tại
                    const locateBtn = L.DomUtil.create('button', '', container);
                    locateBtn.type = 'button';
                    locateBtn.title = 'Về vị trí hiện tại';
                    locateBtn.innerHTML = '<i class="fa fa-location-arrow"></i>';
                    L.DomEvent.on(locateBtn, 'click', L.DomEvent.stopPropagation)
                        .on(locateBtn, 'click', L.DomEvent.preventDefault)
                        .on(locateBtn, 'click', () => centerOnUserLocation());

                    // Nút dẫn đường
                    const routeBtn = L.DomUtil.create('button', '', container);
                    routeBtn.type = 'button';
                    routeBtn.title = 'Dẫn đường tới trung tâm bản đồ';
                    routeBtn.innerHTML = '<i class="fa fa-compass"></i>';
                    L.DomEvent.on(routeBtn, 'click', L.DomEvent.stopPropagation)
                        .on(routeBtn, 'click', L.DomEvent.preventDefault)
                        .on(routeBtn, 'click', () => routeToMapCenter());

                    // Nút xóa lộ trình
                    const clearBtn = L.DomUtil.create('button', '', container);
                    clearBtn.type = 'button';
                    clearBtn.title = 'Xóa lộ trình';
                    clearBtn.innerHTML = '<i class="fa fa-times"></i>';
                    L.DomEvent.on(clearBtn, 'click', L.DomEvent.stopPropagation)
                        .on(clearBtn, 'click', L.DomEvent.preventDefault)
                        .on(clearBtn, 'click', () => clearRoute());

                    return container;
                }
            });
            map.addControl(new CustomControl());
        }

        function routeToMapCenter() {
            const destination = [map.getCenter().lat, map.getCenter().lng];

            if (!Number.isFinite(destination[0]) || !Number.isFinite(destination[1])) {
                displayError('Không thể lấy điểm đến từ trung tâm bản đồ.');
                return;
            }

            function doRoute() {
                fetchMotorbikeRoute(currentLocation, destination)
                    .then(route => {
                        drawRoute(route);
                    })
                    .catch(error => {
                        displayError(error.message);
                    });
            }

            if (currentLocation) {
                doRoute();
                return;
            }

            if (!navigator.geolocation) {
                displayError('Trình duyệt không hỗ trợ định vị.');
                return;
            }

            navigator.geolocation.getCurrentPosition(
                function(position) {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    updateCurrentLocationMarker(lat, lon);
                    doRoute();
                },
                function(error) {
                    displayError('Không thể lấy vị trí: ' + error.message);
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        function clearRoute() {
            if (routeLine) {
                map.removeLayer(routeLine);
                routeLine = null;
            }
        }

        function fetchMotorbikeRoute(origin, destination) {
            const url = `https://router.project-osrm.org/route/v1/driving/${origin[1]},${origin[0]};${destination[1]},${destination[0]}?overview=full&geometries=geojson`;
            return fetch(url)
                .then(response => {
                    if (!response.ok) throw new Error('Không thể tải lộ trình.');
                    return response.json();
                })
                .then(data => {
                    if (!data.routes || data.routes.length === 0 || data.code !== 'Ok') {
                        throw new Error('Không tìm thấy lộ trình xe máy.');
                    }
                    return data.routes[0];
                });
        }

        function drawRoute(route) {
            clearRoute();

            routeLine = L.geoJSON(route.geometry, {
                style: {
                    color: 'red',
                    weight: 5,
                    opacity: 0.8
                }
            }).addTo(map);

            if (routeLine && routeLine.getBounds) {
                map.fitBounds(routeLine.getBounds().pad(0.15));
            }

            if (route.distance != null && route.duration != null) {
                const distanceKm = (route.distance / 1000).toFixed(1);
                const durationMin = Math.round(route.duration / 60);
                displayError(`Lộ trình xe máy: ${distanceKm} km, khoảng ${durationMin} phút.`);
            }
        }

        function routeToMarker(index) {
            const target = markers[index];
            if (!target) {
                displayError('Marker không tồn tại.');
                return;
            }

            function routeFromCurrentLocation() {
                fetchMotorbikeRoute(currentLocation, [target.lat, target.lon])
                    .then(route => {
                        drawRoute(route);
                        target.marker.openPopup();
                    })
                    .catch(error => {
                        displayError(error.message);
                    });
            }

            if (currentLocation) {
                routeFromCurrentLocation();
                return;
            }

            if (!navigator.geolocation) {
                displayError('Trình duyệt không hỗ trợ định vị.');
                return;
            }

            navigator.geolocation.getCurrentPosition(
                function(position) {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    updateCurrentLocationMarker(lat, lon);
                    routeFromCurrentLocation();
                },
                function(error) {
                    displayError('Không thể lấy vị trí: ' + error.message);
                }
            );
        }

        function centerOnUserLocation() {
            if (!navigator.geolocation) {
                displayError('Trình duyệt không hỗ trợ định vị.');
                return;
            }

            navigator.geolocation.getCurrentPosition(
                function(position) {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    updateCurrentLocationMarker(lat, lon);
                    map.setView([lat, lon], 19);
                },
                function(error) {
                    displayError('Không thể lấy vị trí: ' + error.message);
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }
        // ====================== PWA INTEGRATION ======================

        // Online / Offline notification
        window.addEventListener('online', () => {
            displayError('✅ Đã kết nối lại mạng. Có thể cập nhật GitHub.');
            setTimeout(() => displayError(''), 4000);
        });

        window.addEventListener('offline', () => {
            displayError('📴 Bạn đang OFFLINE. Vẫn có thể thêm marker, export file và lưu draft.');
        });

        // Register Service Worker + Install Prompt
        let deferredPrompt;
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => {
                        console.log('✅ Service Worker registered:', reg.scope);
                    })
                    .catch(err => {
                        console.error('❌ Service Worker failed:', err);
                    });

                // PWA Install Prompt
                window.addEventListener('beforeinstallprompt', (e) => {
                    deferredPrompt = e;
                    console.log('📲 PWA install prompt ready');

                    // Tự động thêm nút "Cài đặt App" vào Controls Modal
                    const container = document.querySelector('.controls-container');
                    if (container) {
                        const installBtn = document.createElement('button');
                        installBtn.className = 'btn btn-success btn-block mt-2';
                        installBtn.innerHTML = '<i class="fa fa-download"></i> Cài đặt Lighting System';
                        installBtn.onclick = () => {
                            deferredPrompt.prompt();
                            deferredPrompt.userChoice.then((choice) => {
                                if (choice.outcome === 'accepted') console.log('User installed PWA');
                                deferredPrompt = null;
                            });
                        };
                        container.appendChild(installBtn);
                    }
                });
            });
        }

        // Initialize everything
       // Initialize when page loads
        window.onload = function() {
            map = initializeMap();
            loadDefaultFile();

            // Nút về đầu trang
            const backToTopBtn = document.getElementById('backToTopBtn');
            window.addEventListener('scroll', function() {
                if (window.scrollY > 200) {
                    backToTopBtn.style.display = 'block';
                } else {
                    backToTopBtn.style.display = 'none';
                }
            });
            backToTopBtn.onclick = function() {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            // Thêm nút hiện thêm trên mobile cho button-group
            if (window.innerWidth <= 768) {
                const btnGroup = document.querySelector('.button-group');
                if (btnGroup && !document.getElementById('showMoreBtn')) {
                    const showMoreBtn = document.createElement('button');
                    showMoreBtn.id = 'showMoreBtn';
                    showMoreBtn.className = 'btn btn-outline-secondary btn-block';
                    showMoreBtn.textContent = 'Hiện thêm';
                    showMoreBtn.style.marginTop = '8px';
                    showMoreBtn.onclick = function() {
                        btnGroup.querySelectorAll('.btn').forEach((btn, idx) => {
                            if (idx > 1) btn.style.display = btn.style.display === 'block' ? 'none' : 'block';
                        });
                        showMoreBtn.textContent = showMoreBtn.textContent === 'Hiện thêm' ? 'Ẩn bớt' : 'Hiện thêm';
                    };
                    btnGroup.appendChild(showMoreBtn);
                }
            }
            console.log('Setting up modal controls...');
            const controlsBtn = document.getElementById('controlsBtn');
            console.log('Controls button:', controlsBtn);
            if (controlsBtn) {
                controlsBtn.addEventListener('click', function() {
                    console.log('Controls button clicked');
                    // Try jQuery first, fallback to vanilla JS
                    if (typeof $ !== 'undefined' && $.fn.modal) {
                        $('#controlsModal').modal({
                            backdrop: true,
                            keyboard: true,
                            show: true
                        });
                    } else {
                        console.log('jQuery not available, using vanilla JS');
                        const modal = document.getElementById('controlsModal');
                        if (modal) {
                            modal.style.display = 'block';
                            // Force reflow before adding show class for transition
                            modal.offsetHeight;
                            modal.classList.add('show');
                            document.body.classList.add('modal-open');

                            // Add backdrop
                            const backdrop = document.createElement('div');
                            backdrop.className = 'modal-backdrop show';
                            document.body.appendChild(backdrop);

                            // Close modal when clicking backdrop or close button
                            backdrop.onclick = function() {
                                modal.classList.remove('show');
                                setTimeout(() => {
                                    modal.style.display = 'none';
                                    document.body.classList.remove('modal-open');
                                    document.body.removeChild(backdrop);
                                }, 300); // Wait for transition
                            };

                            const closeBtn = modal.querySelector('.close');
                            if (closeBtn) {
                                closeBtn.onclick = function() {
                                    modal.classList.remove('show');
                                    setTimeout(() => {
                                        modal.style.display = 'none';
                                        document.body.classList.remove('modal-open');
                                        document.body.removeChild(backdrop);
                                    }, 300); // Wait for transition
                                };
                            }
                        }
                    }
                });
                console.log('Event listener attached');
            } else {
                console.error('Controls button not found');
            }

            const controlsModalElement = document.getElementById('controlsModal');
            if (controlsModalElement) {
                controlsModalElement.addEventListener('click', function(event) {
                    if (event.target === controlsModalElement) {
                        closeControlsModal();
                    }
                });
            }

            document.addEventListener('click', function(event) {
                if (event.target && event.target.classList && event.target.classList.contains('modal-backdrop')) {
                    closeControlsModal();
                }
            });

            const saveMarkerBtn = document.getElementById('markerPopupSave');
            const cancelMarkerBtn = document.getElementById('markerPopupCancel');
            if (saveMarkerBtn) {
                saveMarkerBtn.addEventListener('click', saveMarkerPopup);
            }
            if (cancelMarkerBtn) {
                cancelMarkerBtn.addEventListener('click', cancelMarkerPopup);
            }
            // Lazy load ảnh popup khi mở
            document.body.addEventListener('click', function(e) {
                if (e.target && e.target.tagName === 'IMG') {
                    e.target.setAttribute('loading', 'lazy');
                }
            });

            const markerPopupHeader = document.querySelector('#markerPopupForm .marker-popup-card header');
            const markerPopupCard = document.querySelector('#markerPopupForm .marker-popup-card');
            makeElementDraggable(markerPopupHeader, markerPopupCard);
            // Allow closing export modal by clicking backdrop
            const exportCadModal = document.getElementById('exportCadModal');
            if (exportCadModal) {
                exportCadModal.addEventListener('click', function(event) {
                    if (event.target === exportCadModal) {
                        closeExportCadModal();
                    }
                });
            }
            // Bind Export button in Export to CAD modal
            const exportCadBtn = document.getElementById('exportCadBtn');
            if (exportCadBtn) {
                exportCadBtn.onclick = confirmExportCad;
            }
               console.log('🚀 Lighting System V1.1 PWA Ready - Offline Supported');
        };
        // Đặt marker về vị trí hiện tại
        function setMarkerToCurrentLocation() {
            if (!navigator.geolocation) {
                displayError('Trình duyệt không hỗ trợ định vị.');
                return;
            }
            navigator.geolocation.getCurrentPosition(
                function(position) {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    markerPopupLocation = [lat, lon];
                    pendingMarkerLocation = [lat, lon];
                    if (tempMarker) {
                        tempMarker.setLatLng([lat, lon]);
                    } else {
                        tempMarker = L.marker([lat, lon], { icon: customIcons.currentPos }).addTo(map);
                    }
                    document.getElementById('markerCoordsText').textContent = `Tọa độ: ${lat.toFixed(6)}, ${lon.toFixed(6)}`;
                    displayError('Đã lấy vị trí hiện tại.');
                },
                function(error) {
                    displayError('Không thể lấy vị trí: ' + error.message);
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        // Cho phép chọn lại vị trí marker bằng cách click trên bản đồ
        let pickMarkerMode = false;
        function setMarkerToPickOnMap() {
            pickMarkerMode = true;
            displayError('Nhấp vào bản đồ để chọn vị trí marker mới.');
        }

        // Hook vào sự kiện click trên bản đồ để cập nhật vị trí marker khi đang chọn
        if (window.map) {
            map.on('click', function(e) {
                if (pickMarkerMode && addMarkerMode && document.getElementById('markerPopupForm').style.display === 'flex') {
                    markerPopupLocation = [e.latlng.lat, e.latlng.lng];
                    pendingMarkerLocation = [e.latlng.lat, e.latlng.lng];
                    if (tempMarker) tempMarker.setLatLng(e.latlng);
                    document.getElementById('markerCoordsText').textContent = `Tọa độ: ${e.latlng.lat.toFixed(6)}, ${e.latlng.lng.toFixed(6)}`;
                    displayError('Đã chọn vị trí trên bản đồ.');
                    pickMarkerMode = false;
                }
            });
        } else {
            window.addEventListener('load', function() {
                if (window.map) {
                    map.on('click', function(e) {
                        if (pickMarkerMode && addMarkerMode && document.getElementById('markerPopupForm').style.display === 'flex') {
                            markerPopupLocation = [e.latlng.lat, e.latlng.lng];
                            pendingMarkerLocation = [e.latlng.lat, e.latlng.lng];
                            document.getElementById('markerCoordsText').textContent = `Tọa độ: ${e.latlng.lat.toFixed(6)}, ${e.latlng.lng.toFixed(6)}`;
                            displayError('Đã chọn vị trí trên bản đồ.');
                            pickMarkerMode = false;
                        }
                    });
                }
            });
         
        };
    </script>
</body>
</html>
